[project]
# The PyPI distribution name. It is deliberately NOT "sluice": that name has been squatted
# since 2015 by an unrelated, dormant zfs-snapshot tool (last release 0.3.1, 2015-08-28) with
# no console script of its own, so there is no binary collision -- but `pip install sluice`
# can never resolve to this project. "job-sluice" is the distribution AND the console script
# (see [project.scripts] below); the IMPORT PACKAGE stays `sluice` (so `import sluice` and
# every `SLUICE_*` env var / XDG path are unaffected -- those are internal, invisible to a
# user, and renaming the XDG state directory would be a breaking CONFIG change for zero
# user-visible benefit). Distribution name, import name and command name are three
# independent things in Python packaging; only the first and third changed here.
name = "job-sluice"
# ONE home for the version: `sluice/__init__.py`. It was declared here AND there, with
# nothing tying the two together -- so a release could bump one, ship the other, and
# `pip show job-sluice` would disagree with `job-sluice --version` silently. setuptools reads
# the attribute STATICALLY for a plain literal, so this costs no import at build time.
dynamic = ["version"]
description = "Sluice: an engineered, config-driven job-hunting pipeline (ingest, triage, CV tailoring, apply, track)."
requires-python = ">=3.12"
dependencies = ["pyyaml"]
# PEP 639 SPDX license expression -- the modern, non-deprecated form. setuptools >=77 (this
# repo pins >=83 in [build-system] and the test extra) HARD-ERRORS at build time
# (setuptools.errors.InvalidConfigError, confirmed by a real build attempt -- not merely a
# warning) if a `License ::` classifier is combined with this field, so no such classifier
# is added below. Emits `License-Expression: MIT` in the built wheel's METADATA (Core
# Metadata 2.4), not the older `License:` field.
license = "MIT"
# Explicit for self-documenting intent and to constrain the glob against a future
# NOTICE/COPYING/AUTHORS file this repo doesn't have today. setuptools already
# auto-discovers LICENSE via its own default glob (LICEN[CS]E*/COPYING*/NOTICE*/AUTHORS*)
# when this is unset, so removing this line would NOT stop the LICENSE file from
# shipping -- see the test docstring below for why that makes this line unfalsifiable
# by absence, and what's tested instead.
license-files = ["LICENSE"]
# setuptools auto-derives Description-Content-Type: text/markdown from the .md extension --
# no separate content-type declaration needed. Without this, PyPI's project page renders
# with a blank description.
readme = "README.md"
# Ships in every published sdist/wheel, so this is pinned to the same noreply identity every
# commit trailer in this repo's git history already uses -- never a personal email address.
authors = [
    {name = "MrReasonable", email = "4990954+MrReasonable@users.noreply.github.com"},
]
# Python-version entries must match .github/workflows/ci.yml's matrix.python-version exactly
# (tests/test_packaging.py::test_wheel_metadata_carries_the_ci_matrix_python_classifiers pins
# this) -- a CI matrix bump with no corresponding update here goes silently stale on PyPI.
# No "License :: OSI Approved :: MIT License" classifier: combined with the PEP 639
# license = "MIT" SPDX expression above, setuptools >=77 HARD-ERRORS on that pairing
# (InvalidConfigError) rather than merely warning about it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
keywords = ["job-search", "job-hunting", "cli", "cv", "resume", "automation"]

[project.scripts]
job-sluice = "sluice.cli:main"

[project.optional-dependencies]
render = ["weasyprint", "jinja2"]
google = ["google-api-python-client", "google-auth"]
# Shell completion (zsh, bash, tcsh, fish). Same shape as `render`/`google`: a bare install
# never needs it, `sluice/cli.py` guards the import (`try/except ImportError`), and
# `argcomplete.autocomplete(parser)` is itself a no-op unless a shell's completion hook has
# set `_ARGCOMPLETE` in the environment -- so importing it costs nothing on an ordinary run.
# Chosen over a hand-generated static completion script (an earlier draft of this extra):
# argcomplete's `.completer` callbacks complete REAL values -- actual registered source ids,
# actual status tokens -- by reading the live argparse tree, so there is no generated file to
# keep in sync and no drift-detection machinery needed at all.
completion = ["argcomplete"]
# `job-sluice mcp serve`'s only dependency (sluice/mcpserver.py:build_server(), the
# ONE place `mcp` is imported -- see .rulesync/rules/CLAUDE.md's stdlib-only
# exception list). Pinned at >=2.0.0: that release renamed the high-level server
# class FastMCP -> MCPServer (mcp.server.fastmcp -> mcp.server.mcpserver) and is the
# first version to ship a top-level `mcp.Client` for in-memory testing
# (tests/functional/test_mcp_contract.py) -- verified against a real install,
# 2026-08-12. A 1.x install has FastMCP but no top-level Client; >=2.0.0 is the only
# floor where both halves of this feature are buildable from one dependency.
mcp = ["mcp>=2.0.0"]
# The suite generates its own synthetic job titles rather than hardcoding anyone's
# real role preferences, so faker is a test dependency (see tests/conftest.py).
#
# pytest-cov is DEV-TIME ONLY and does not breach CLAUDE.md's stdlib-only rule, which binds
# what SHIPS -- `dependencies` above, and the `render`/`google` extras a user opts into. This
# extra is the same category as faker: installed to run the gate, never imported by `sluice/`.
#
# jinja2 is in BOTH `render` and `test`, deliberately. CI installs only `[test]`, so a
# shipped-template test written as `pytest.importorskip("jinja2")` would SKIP in CI and
# read as green -- the exact trap tests/test_renderers.py records having been hit by, when
# an importorskip("weasyprint") silently disabled the one test pinning citation stripping.
# jinja2 is pure Python with no system libraries, so it belongs here on the same footing as
# faker. WeasyPrint stays OUT: it needs cairo/pango, and is covered by injected fakes.
# `mcp` is in BOTH `mcp` and `test` for the identical reason: CI installs only `[test]`, so
# `tests/functional/test_mcp_contract.py` needs the real package to drive `Client`/`MCPServer`
# for real, not skip itself via `pytest.importorskip`.
#
# setuptools + build are here so tests/test_packaging.py can build a REAL wheel offline
# (`--no-isolation`, measured at 0.6s). Dev-time only, never imported by `sluice/`.
test = ["pytest", "faker", "pytest-cov", "jinja2", "setuptools>=83.0.0", "build", "mcp>=2.0.0"]

# `packages.find` selects PACKAGES, not DATA. Without this table a built wheel ships
# sluice/templates/__init__.py and NOT the template beside it -- measured 2026-08-06 --
# so every `pip install job-sluice` would get the default renderer with no template to render.
[tool.setuptools.package-data]
sluice = ["templates/*.html.j2"]

# Homepage and Source deliberately point at the identical URL: no separate docs/marketing
# site exists for this project, so there is nothing distinct for Homepage to name. Not an
# oversight to "fix" by picking a different value for one of them.
[project.urls]
Homepage = "https://github.com/MrReasonable/sluice"
Changelog = "https://github.com/MrReasonable/sluice/blob/main/CHANGELOG.md"
Issues = "https://github.com/MrReasonable/sluice/issues"
Source = "https://github.com/MrReasonable/sluice"
Documentation = "https://github.com/MrReasonable/sluice/blob/main/docs/USAGE.md"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "sluice.__version__"}

[tool.setuptools.packages.find]
include = ["sluice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--cov` is deliberately NOT here. addopts applies to every invocation, so a coverage run
# would be forced on `pytest -k one_test` and on the mutation-testing loop, where the report is
# noise and the tracer is pure overhead. CI opts in explicitly; see .github/workflows/ci.yml.
addopts = "-q"

# Coverage REPORTS, it does not gate. There is deliberately no `fail_under` here: a threshold
# invites tests written to raise the number rather than to catch bugs, which is the failure mode
# this repo can least afford -- three of its worst bugs (a flag parsed and never forwarded, a
# fallback backend believed in and non-functional, a default that binned every lead) were all
# invisible to a fully green suite. See issue #11.
[tool.coverage.run]
# `scripts/` sits beside `sluice/` because guard scripts ARE the merge gate:
# `.rulesync/rules/CLAUDE.md` puts them under the mutation-testing bar and CI lints them, and an
# unexercised guard is the exact fail-open class this repo spends its life engineering out.
# tests/test_ci_wiring.py derives this list from that same lint bar rather than re-listing it.
source = ["sluice", "scripts"]
# Branch coverage, not just line coverage. #11's stated purpose is to show "which paths are
# asserted and which merely execute", and a fully-executed `if` with only one arm taken is
# exactly that distinction -- line coverage calls it 100% and says nothing.
branch = true
# Store paths relative to the project root. Without this a report rendered from any other
# working directory prints the checkout's absolute path -- the runner's under CI, and a real
# home directory locally, which is the shape of leak tests/test_no_leaked_files.py exists to
# catch. (It caught this comment, too, when it first spelled the runner path out.)
relative_files = true

[tool.coverage.report]
# The per-file breakdown #11 asks for is only actionable if it names the uncovered lines.
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # ruff's default set, made explicit

[tool.ruff.lint.per-file-ignores]
# Test doubles use compact one-liners, grouped imports, short loop names, and inline
# lambdas by design; F (unused import/var) is NOT relaxed here, so real cruft is still
# caught. E731 (lambda-assignment) is included so a lambda double in the tests does not
# keep ruff red.
"tests/*" = ["E701", "E702", "E741", "E401", "E731"]
