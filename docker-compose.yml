# job-sluice under Docker Compose (#104, PR 4 of 7).
#
# What this file is FOR: the image alone needs a long `docker run` to be useful, because four
# separate directories have to survive the container -- the vault, the config, and two pieces of
# per-system state. Getting one of them wrong is not a visible error, it is a silent data
# problem, so the wiring is written down once here rather than retyped per invocation.
#
# The image does not exist until 1.1.0 publishes it. This file is inert until then, exactly like
# the `docker` job that will push it.
#
# Camofox is NOT here, and cannot be: `ingest run`/`ingest test-source` need a persistent,
# authenticated headless browser server that this repository does not bundle. It runs on the
# host; `CAMOFOX_URL` below points the container at it. Every other command works without it,
# and `triage`/`cv` reach it only on a dossier cache miss -- which is why the cache volume below
# is worth keeping.

x-sluice: &sluice
  image: ghcr.io/mrreasonable/job-sluice:${JOB_SLUICE_TAG:-latest}

  # Backend credentials. Which variables matter depends on which providers you configured as
  # `primary_backend`/`fallback_backend`, so they are deliberately NOT enumerated here: a list
  # in this file would be a second source of truth that goes stale the moment a provider is
  # added. Put whatever your configured providers need in `.env`.
  #
  # `claude-max` is the SHIPPED DEFAULT for primary_backend and needs no API key -- but it shells
  # out to the `claude` CLI, which this image does not carry. You have two options, and doing
  # neither leaves `doctor` reporting it `dead` with triage/cv/track blocked:
  #
  #   1. Configure `primary_backend` as `anthropic`, `openai` or `deepseek` and put that
  #      provider's key in `.env`. Simplest; costs per token rather than the flat rate.
  #   2. Point it at the `claude` CLI on your HOST over ssh -- the four SLUICE_CLAUDE_* variables
  #      below. Keeps the flat rate. See docs/INSTALL.md's "claude-max from a container".
  #
  # `required: false` so `docker compose up` works with no `.env` at all -- an absent optional
  # file must not be a startup error. Needs Compose v2.24+ for the long form.
  env_file:
    - path: .env
      required: false

  environment:
    # PINNED, not left to the config file, and this is the load-bearing line in this file.
    #
    # `stores/vault.py:_make` is `Vault(os.environ.get("VAULT_DIR") or config.vault_dir or None)`,
    # so this env var outranks a configured value BY CONSTRUCTION. That matters because the config
    # directory below is bind-mounted from the host: a `job-sluice init` run on the host leaves an
    # absolute HOST vault path in config.yaml, which means nothing inside the container. The
    # reverse also holds and is NOT fixed by this pin: `init` run INSIDE the container abspaths
    # `vault_dir: /work/vault` into that same shared config, so a later HOST run reads a path
    # that does not exist there and reports zero leads. Run `init` on the host, or not at all.
    #
    # Without this pin the failure is silent and unrecoverable. `Vault` never checks that its
    # directory exists, and `upsert`'s create arm runs `os.makedirs(leads_dir, exist_ok=True)`
    # (core/vault.py) -- so a wrong path is CREATED, in the container's ephemeral layer. Leads land
    # there as `created`, and `created` is on `ingest/sink.py`'s allowlist, so they are recorded in
    # seen.db -- which is a persistent named volume below. Remove the container and the notes are
    # gone while seen.db still remembers them, and seen.db has no removal path: those leads are
    # suppressed forever, with no note anywhere, after a run that printed a plausible `created: N`.
    # That is the #81 harm reached by a route core/paths.py cannot guard, because the vault
    # deliberately does not relocate to an XDG root and so is not in its `_LEGACY` table.
    VAULT_DIR: /work/vault

    # The one genuinely container-specific value: on the host, Camofox's default is
    # http://127.0.0.1:9377, which inside a container means the CONTAINER's loopback and would
    # fail to connect with no obvious reason why. The scheme is REQUIRED -- core/camofox.py
    # concatenates this value directly, so a scheme-less host:port raises `unknown url type`.
    CAMOFOX_URL: ${CAMOFOX_URL:-http://host.docker.internal:9377}

    # Reaching the host's `claude` CLI (#209). All four are unset by default, and the entrypoint
    # does nothing beyond a BatchMode floor unless a non-empty key is mounted below -- so an API-key install
    # is untouched by their presence here.
    #
    # SLUICE_CLAUDE_HOST/PATH are read by sluice itself and set `claude_max_host`/`claude_max_path`
    # for triage, cv AND track at once. PATH must be ABSOLUTE: `ssh host cmd` runs a
    # non-interactive, non-login shell whose PATH is minimal, so a bare `claude` is not found.
    # It is also what the host's forced-command wrapper is keyed to, so it can be any non-empty
    # token when that wrapper is in use -- the wrapper decides which binary actually runs.
    #
    # SSH_USER is the account on the HOST. The container user is `sluice`, which is almost
    # certainly not your login name, and ssh would otherwise offer the wrong one.
    SLUICE_CLAUDE_HOST: ${SLUICE_CLAUDE_HOST:-}
    SLUICE_CLAUDE_PATH: ${SLUICE_CLAUDE_PATH:-}
    SLUICE_CLAUDE_SSH_USER: ${SLUICE_CLAUDE_SSH_USER:-}
    #
    # PINNED EMPTY, deliberately, and this line is load-bearing. SLUICE_CLAUDE_KEY names a path on
    # YOUR MACHINE and is used below as the bind-mount SOURCE; the entrypoint reads a fixed
    # in-container TARGET. Omitting it from this block is NOT enough to keep the two apart:
    # `env_file: .env` above injects every variable in .env into the container, and
    # docs/INSTALL.md tells the reader to put SLUICE_CLAUDE_KEY there. Rendered with
    # `docker compose config`, the host path appeared verbatim in the container environment.
    # An `environment:` entry overrides an env_file one, so this is what stops it.
    SLUICE_CLAUDE_KEY: ""

  # Linux does not resolve host.docker.internal on its own; Docker Desktop does. This makes the
  # two behave the same rather than leaving a platform-dependent failure for the user to hit.
  extra_hosts:
    - "host.docker.internal:host-gateway"

  volumes:
    # THE WHOLE WORKING DIRECTORY, not just the vault -- and this closes a second Critical of
    # exactly the same shape as the VAULT_DIR one above.
    #
    # Five artefact directories in this codebase are cwd-relative BY DESIGN (cv/config.py's
    # render_home/output_dir/served_dir, cv/render.py's home, apply/config.py's
    # camofox_upload_dir and camofox_cv_dir): docs/CONFIGURATION.md calls them "a workspace
    # you're standing in, not per-system state", which is right on a host and fatal in a
    # container. Under WORKDIR /work they land in the container's writable layer, and
    # `docker compose run --rm` -- the invocation this very file prescribes -- deletes it.
    #
    # The rendered PDF would die with the container while the POINTER to it survives in the
    # vault note, which is persistent. cv/engine.py writes that pointer after serving the file,
    # so the next `cv run` reports `skipped-has-cv` and never recomposes, while `apply prep`
    # reports `missing_file` (apply/select.py) -- the lead wedges between two commands that each
    # refuse it, after a run that printed `rendered`. A lead holding a #60 `pending_cv` sign-off
    # hold is worse: `cv signoff` would promote a pointer to a file that no longer exists.
    #
    # Mounting /work WHOLE rather than listing those five directories is deliberate. A list
    # would silently go stale the day a sixth cwd-relative artefact is added; this cannot.
    # The vault bind mount below nests inside this volume, which is why it still wins for its
    # own subtree -- verified against a real `compose run --rm`, not assumed.
    - sluice-workspace:/work

    # TWO RESIDUALS, stated rather than left to be discovered:
    #
    # This guarantee is DEFAULTS-ONLY. None of the five cwd-relative keys goes through
    # core/paths.py, so none has the env-var override VAULT_DIR gets above -- a host-set
    # `cv.output_dir: ~/cv-output` in the shared config puts the artefact back outside every
    # mount, silently. Keep those keys unset unless you also mount where you point them.
    #
    # `docker compose down -v` destroys this volume. A lead holding a #60 `pending_cv` hold then
    # keeps its pointer in the vault while the PDF is gone, and `cv signoff` will offer to
    # promote a file that no longer exists. Recoverable with `cv signoff --discard`, which is
    # why this is a note and not a refusal -- but it is not obvious from `down -v`.

    # The vault -- your Obsidian directory, and the one thing here that is genuinely yours.
    # It lands at /work/vault because WORKDIR is /work and this codebase's DEFAULT_VAULT is the
    # cwd-relative "./vault", so the default resolves to exactly this mount with no config at
    # all. The vault deliberately does not relocate via XDG; it is not per-system state.
    - ${SLUICE_VAULT:-./vault}:/work/vault

    # Config. $XDG_CONFIG_HOME is /app/config in the image, and config_file() resolves to
    # <XDG_CONFIG_HOME>/sluice/config.yaml -- so config.yaml goes in the host directory below.
    # A bind mount whose host directory does not exist yet is created by Docker as ROOT, which
    # the container's non-root user then cannot write: create it first, or run `job-sluice init`
    # on the host, if you want the container to be able to write its config.
    - ${SLUICE_CONFIG_DIR:-./config}:/app/config/sluice

    # State, as a NAMED volume rather than a bind mount, because it is the tool's bookkeeping
    # and not something you edit. Keeping it is load-bearing: it holds the dedup databases, and
    # an empty dedup set makes every already-known lead read as unseen and re-submits it to the
    # write path (#81). `docker compose down` preserves this; `down -v` destroys it.
    #
    # A host install's existing seen.db is NOT migrated here, and core/paths.py's relocation
    # refusal structurally cannot notice: it compares paths inside this container and never sees
    # the host's. The first container run therefore starts with an empty dedup set. With the vault
    # correctly mounted above that is a re-scrape rather than a re-application -- `upsert` finds
    # the existing notes and returns `updated` -- so the cost is work, not duplicate applications.
    # Copy the host file in beforehand if you want to skip even that.
    - sluice-state:/app/state/sluice

    # Dossier cache. Losing it costs re-fetches (and so needs Camofox again), never correctness.
    - sluice-cache:/app/cache/sluice

    # The ssh key for the host's claude CLI (#209), read-only, and deliberately NOT under
    # ~/.ssh: mounting a file into that directory makes docker create it root-owned, and the
    # container user then cannot write known_hosts -- which surfaces as "Host key verification
    # failed" even with StrictHostKeyChecking=accept-new. The entrypoint copies it into place
    # with the right ownership and mode instead.
    #
    # Inert when SLUICE_CLAUDE_KEY is unset, which is the default -- but by /dev/null plus
    # `create_host_path: false`, NOT by a `required:` key, which a bind mount does not take.
    # The entrypoint then sees an empty file and its `-s` test is false. The TOKEN this key ultimately authenticates with never enters the container:
    # it lives on the host, read by the forced-command wrapper there.
    - type: bind
      source: ${SLUICE_CLAUDE_KEY:-/dev/null}
      target: /run/secrets/sluice_claude_key
      read_only: true
      bind:
        create_host_path: false

services:
  job-sluice:
    <<: *sluice
    # No `command:`, so the image's own ENTRYPOINT + CMD apply and
    # `docker compose run --rm job-sluice <args>` reads exactly like the bare CLI.

  # `job-sluice mcp serve` speaks MCP over STDIO -- there is no HTTP or SSE transport in
  # sluice/mcpserver.py, so there is no port to publish and this is not a long-running service.
  # It is a profile so an ordinary `docker compose up` does not try to start it:
  #
  #   docker compose run --rm -T mcp
  #
  # is what an MCP client should be configured to launch. `-T` matters: it disables TTY
  # allocation, and a TTY would corrupt the stdio framing. Everything this needs -- the vault,
  # the config, the same state -- comes from the shared block above, which is the whole reason
  # it is worth expressing here rather than as a hand-written `docker run -i`.
  mcp:
    <<: *sluice
    profiles: [mcp]
    stdin_open: true
    command: ["mcp", "serve"]

volumes:
  sluice-workspace:
  sluice-state:
  sluice-cache:
