name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check sluice tests scripts
      - run: pip install --require-hashes -r .github/zizmor-requirements.txt
      - run: zizmor --offline --strict-collection .github/workflows/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # ".[test]" pulls pytest, faker AND pytest-cov: the suite generates its own synthetic
      # job titles rather than hardcoding anyone's real role preferences, and #11 asks CI to
      # report what the suite covers.
      - run: pip install -e ".[test]"
      # Bare `--cov`: every knob (source, branch, show_missing) lives in pyproject.toml, so a
      # local `python -m pytest --cov` renders the SAME report. It reports and does not gate --
      # there is no `--cov-fail-under`, deliberately; see the note in pyproject.toml.
      #
      # Run on EVERY matrix leg rather than singling one out. A `if: matrix.python-version ==
      # '3.12'` would be more machinery, not less, and it fails OPEN: bump the matrix past that
      # literal and the condition matches no leg, coverage silently stops being measured, and
      # nothing goes red. And three legs do NOT stack three tables on one page: the variable is
      # per-STEP, and GitHub groups "the summaries for all steps in a job [...] into a single job
      # summary", listing one per job -- so each leg renders its own, and a gap that exists only
      # on one interpreter version becomes visible instead of being averaged away.
      - run: python -m pytest --cov
      # Re-render the SAME data as markdown so the per-file breakdown lands on the run's summary
      # page rather than only in the log.
      #
      # `-u` is the load-bearing flag, and NOT for the reason this comment first gave. An unset
      # $GITHUB_STEP_SUMMARY does not pass silently: the redirect fails on a compound command and
      # the step exits 1 under plain `bash`, no flags needed -- measured. What DOES pass silently
      # is an unset $PYTHON_VERSION, which renders the heading `## Coverage (Python )` and exits
      # 0. `-u` turns that into an unbound-variable error. `-e` is already GitHub's default
      # (`bash -e {0}`); `pipefail` is inert here with no pipe in the block, and is kept only so
      # that adding one later cannot silently swallow a failure the way it could in `rulesync`.
      #
      # No `if: always()` -- on a red suite the failing tests are the signal, and a coverage
      # table rendered from a partial run would understate coverage for reasons unrelated to it.
      - name: Publish the coverage report to the run summary
        # Via env, never interpolated into the script body. `matrix.python-version` is authored
        # here and not attacker-controlled, so this is hygiene rather than a live hole -- but a
        # `${{ }}` inside `run:` is pasted as TEXT before bash ever sees it, and keeping the
        # workflow free of that shape is what stops a later edit reaching for it with something
        # that IS attacker-controlled. zizmor's template-injection audit gates on the same rule.
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          {
            echo "## Coverage (Python $PYTHON_VERSION)"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  rulesync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # --ignore-scripts: one package in the pinned tree declares a postinstall. It is
      # env-gated and does not fetch by default, but it executes outside the lockfile's
      # determination -- exactly what the lockfile is here to rule out.
      - run: npm ci --ignore-scripts
      - run: |
          set -euo pipefail
          # `.claude/settings.json` is the one rulesync output this repo tracks (it also
          # carries Claude Code's hand-authored `enabledPlugins` key), so the checkout always
          # supplies a copy before generation runs. Clearing its `hooks` key first forces
          # rulesync to rewrite that key fresh every run -- without it, a copy that already
          # matches gets silently SKIPPED and omitted from the summary, breaking the exact
          # count guard below; and a genuinely broken generate run would leave a stale but
          # structurally-valid copy in place, defeating the emitted-content guard after it.
          # scripts/reset_tracked_hooks.py's own docstring has the measured chain.
          python3 scripts/reset_tracked_hooks.py .
          npm run rulesync | tee "$RUNNER_TEMP/rulesync-output.txt"
          python scripts/guard_rulesync_drift.py "$RUNNER_TEMP/rulesync-output.txt"
          # The one content assertion the drift guard structurally cannot make: it counts
          # FILES, and a count is identical whether or not the hook it counted carries a
          # command. Only the emitted artifact can tell, and this job is the first environment
          # where node exists and the generator has actually run. It cannot live in the pytest
          # suite, which is offline and never shells out to npm. The check lives in a SCRIPT,
          # not a heredoc: an inline interpreter block is invisible to `ruff check`, cannot be
          # unit-tested, and leaves a step whose command says nothing about what it does.
          # Its docstring records why it checks ONLY the hook and deliberately stops there.
          python scripts/guard_emitted_outputs.py .
          # FAIL CLOSED, twice over. `if [ -n "$(git status --porcelain)" ]` DISCARDS the
          # substitution's exit status, and `set -e` is suppressed inside an `if` condition --
          # so a git that cannot run reports a CLEAN tree and a gitignore gap ships green.
          # Assign first, check the status, then test the value.
          if ! dirty=$(git status --porcelain); then
            echo "git status failed -- refusing to certify a clean tree" >&2
            exit 1
          fi
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            exit 1
          fi

  # A REAL `docker build` on every pull request, single-arch and never pushed (#104 PR 4).
  #
  # WHY THIS EXISTS: the release workflow's `docker` job is gated on `release_created`, so its
  # first ever execution would be AFTER the tag is public. That is not hypothetical -- `build`
  # and `twine check --strict` had exactly that shape until 1.0.0, and their first real run came
  # after the release was cut. A broken Dockerfile discovered there is a publicly visible,
  # partially-failed release; discovered here it is a red check on a pull request.
  #
  # No `paths:` filter, deliberately. `ci-success` is the required check for the `qa-gates`
  # ruleset, and a path-filtered job makes that check dishonest on every run where it does not
  # fire. Measured on its first real run: 34 seconds end to end, build included.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Deliberately NOT `pip install --require-hashes -r .github/build-requirements.txt`, which
      # is what the release `build` job uses. This wheel is a smoke fixture that is discarded at
      # the end of the job, not an artefact anyone publishes, so hash-pinning it would couple a
      # pull-request check to the release supply chain for no property gained -- and would create
      # a THIRD copy of the release build sequence, firing the composite-action extraction the
      # PyPI PR deliberately deferred. `tests/test_ci_wiring.py` asserts this job does not
      # reference that file, so "make CI consistent with the release build" cannot be taken
      # silently.
      - run: pip install build
      - run: python -m build --wheel
      - run: docker build -t job-sluice:ci .
      - name: Smoke -- the console script runs
        run: docker run --rm job-sluice:ci --version
      # The highest-value assertion in this job. WeasyPrint links natively against cairo/pango,
      # which `--version` never touches, so an image missing every system library still passes
      # the step above. It covers ALL FOUR baked extras rather than `render` alone because
      # `pip install` only WARNS on an unknown extra -- a typo'd or renamed one would otherwise
      # ship an image silently missing google, mcp or completion with nothing red anywhere.
      - name: Smoke -- every baked extra imports, system libraries included
        run: docker run --rm --entrypoint python job-sluice:ci -c "import weasyprint, jinja2, googleapiclient, mcp, argcomplete"
      # The compose file is a shipped artefact too -- docs/INSTALL.md tells people to use it --
      # and `tests/test_docker_channel.py` asserts a great deal about it, but only STATICALLY,
      # from the file's own text. Rendering is a different question: whether the real Compose
      # implementation accepts it, and what it actually produces after interpolation, env_file
      # merge and the `x-sluice` anchor are applied. The long-form `env_file:` here needs
      # Compose v2.24+, which no amount of reading the file can establish.
      - name: Smoke -- the compose file renders, and does not leak the ssh key path
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/dev/null
          # THE assertion, and it falsifies a claim the compose file makes in prose rather than
          # restating it. That file pins `SLUICE_CLAUDE_KEY: ""` in `environment:` specifically
          # because `env_file: .env` would otherwise inject the HOST key path into the container
          # environment -- a leak found once by rendering by hand. The variable legitimately
          # appears as a bind-mount SOURCE; what must never happen is it reaching the container
          # as an environment value.
          work="$(mktemp -d)"; cp docker-compose.yml "$work/"
          printf 'SLUICE_CLAUDE_KEY=/host/only/id_leak\n' > "$work/.env"
          rendered="$(cd "$work" && docker compose config)"
          printf '%s\n' "$rendered" | grep -q 'source: /host/only/id_leak' || {
            echo "::error::the ssh key path no longer reaches the bind mount -- the mount is broken"; exit 1; }
          if printf '%s\n' "$rendered" | grep -E '^\s+SLUICE_CLAUDE_KEY: .*id_leak'; then
            echo "::error::the host ssh key path leaked into the container environment"; exit 1
          fi
      # `doctor` exits 1 in ANY container by design: DoctorReport.exit_code() returns 1 whenever
      # a check is DEAD, and claude-max is DEAD whenever the `claude` CLI is absent from PATH,
      # which it always is here. So the status is asserted in NEITHER direction -- 0 would fail
      # every run, and 1 would pin a degraded state as correct and start lying the moment a check
      # changed. It is captured rather than discarded with a trailing `|| true`, because a bare
      # "no traceback" negative passes against a container that prints nothing or dies before
      # doctor runs at all; the report must be positively present too.
      - name: Smoke -- the built image installs and runs
        run: |
          set -euo pipefail
          v="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' sluice/__init__.py)"
          [ -n "$v" ] || { echo "::error::could not read the version"; exit 1; }
          # The same split rule the `packages` job is built on: the image is assembled from
          # `dist/*.whl` in the build CONTEXT, so everything this asserts -- package data
          # surviving the copy, the plugin registry populating, three version sources agreeing
          # -- is determined at BUILD time and belongs before merge. Only a corrupt push or a
          # wrong tag needs the registry, and post-release.yml covers that.
          # `--trust-env` because the image SETS its own XDG_* roots (see the Dockerfile): here
          # those variables are the artefact, not contamination from a caller's shell.
          docker run --rm --entrypoint python3 \
            -v "${PWD}/scripts/smoke_installed.py:/tmp/smoke.py:ro" -w /tmp \
            job-sluice:ci /tmp/smoke.py "$v" --channel ci-docker --trust-env
      - name: Smoke -- doctor renders its report
        run: |
          set -uo pipefail
          # `doctor_status`, not `status`: the latter is a READ-ONLY variable in zsh, so the
          # otherwise-identical snippet fails the moment anyone pastes it into their own shell
          # to reproduce a CI failure. The job itself runs bash, where it would have worked.
          if out="$(docker run --rm job-sluice:ci doctor --offline 2>&1)"; then
            doctor_status=0
          else
            doctor_status=$?
          fi
          printf '%s\n' "$out"
          case "$out" in
            *"job-sluice doctor"*) ;;
            *) echo "::error::doctor emitted no report (exit $doctor_status) -- the image is broken, not merely degraded"; exit 1 ;;
          esac
          case "$out" in
            *Traceback*) echo "::error::doctor raised inside the image (exit $doctor_status)"; exit 1 ;;
          esac


  # The install path, exercised on every pull request rather than after the tag is public.
  #
  # WHY THIS EXISTS is the argument the `docker` job above already makes, applied to the other
  # artefacts: the release workflow's `linux-packages` job is gated on `release_created`, so a
  # .deb that installs into an unusable state is discovered by whoever downloads it. #104 is
  # the precedent -- packages whose directories were mode `drw-r--r--` worked perfectly for
  # root, and root is who verified them.
  #
  # NON-ROOT is therefore the point. Root bypasses directory traversal checks, so installing as
  # root and running as root cannot see the failure and looks identical to success. The release
  # workflow's static `dpkg-deb -c` / `rpm -qlvp` mode check is a good proxy for the same
  # property; this is the direct evidence, and the two are cheap enough to keep both.
  #
  # `scripts/smoke_installed.py` is shared with `post-release.yml`, which runs the same checks
  # against the PUBLISHED artefacts. The split is deliberate: everything determined at BUILD
  # time is caught here, before merge, and only what the registry itself can get wrong -- a
  # corrupted upload, a wrong tag -- has to wait for the release.
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Same reasoning as the `docker` job's build: a smoke fixture discarded at the end of the
      # job, not an artefact anyone publishes, so it is deliberately NOT hash-pinned against the
      # release supply chain.
      - run: pip install build
      # BOTH artefacts, because both are published. The split this job exists to enforce is
      # that everything determined at BUILD time is checked before merge, and only what the
      # REGISTRY can get wrong waits for the release -- and whether an sdist builds is a pure
      # function of the tagged tree, not of the upload. Building the wheel alone left
      # `pip install --no-binary` (post-release.yml's own "how a missing build-time file
      # surfaces") first executing AFTER the tag was public, which is the position this job
      # was created to stop things being in.
      - run: python -m build
      - name: The built wheel installs and runs in a clean environment
        env:
          VERSION_FROM: sluice/__init__.py
        run: |
          set -euo pipefail
          v="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' "$VERSION_FROM")"
          [ -n "$v" ] || { echo "::error::could not read the version"; exit 1; }
          # From a directory that is NOT the checkout: Python puts the working directory on
          # sys.path, so running here would import the source tree and certify a package it
          # never loaded. The smoke script refuses that case, but not creating it is better.
          smoke="$PWD/scripts/smoke_installed.py"
          wheel="$(ls "$PWD"/dist/*.whl)"
          work="$(mktemp -d)"; cd "$work"
          python -m venv v
          ./v/bin/pip install --quiet "$wheel"
          PATH="${work}/v/bin:$PATH" ./v/bin/python "$smoke" "$v" --channel ci-wheel
      - name: The built sdist builds, installs and runs in a clean environment
        env:
          VERSION_FROM: sluice/__init__.py
        run: |
          set -euo pipefail
          v="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' "$VERSION_FROM")"
          [ -n "$v" ] || { echo "::error::could not read the version"; exit 1; }
          smoke="$PWD/scripts/smoke_installed.py"
          sdist="$(ls "$PWD"/dist/*.tar.gz)"
          work="$(mktemp -d)"; cd "$work"
          python -m venv v
          # No `--no-binary` here, and the reason is worth stating because the obvious
          # instinct is wrong in BOTH directions. Passing the sdist by PATH already forces a
          # real build of it: `dist/` is on no finder path, so the wheel sitting beside it
          # never competes (measured -- `Building wheels for collected packages: job-sluice`).
          # And `--no-binary :all:` is not a harmless belt-and-braces, because pip forwards
          # format control into the isolated PEP 517 build environment: setuptools, PyYAML's C
          # extension and tzdata would all build from source, making third-party sdist
          # buildability a gate on every PR through `ci-success`. `post-release.yml` keeps its
          # copy of the flag -- that leg installs by NAME from a real index, where a wheel
          # genuinely would win and the flag is load-bearing.
          ./v/bin/pip install --quiet "$sdist"
          PATH="${work}/v/bin:$PATH" ./v/bin/python "$smoke" "$v" --channel ci-sdist
      - name: Fetch and verify nfpm
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum --check --strict -
          tar -xzf nfpm.tar.gz nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
      - name: Build the .deb and .rpm from that wheel
        run: |
          set -euo pipefail
          python scripts/build_linux_packages.py
          v="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' sluice/__init__.py)"
          VERSION="$v" ./nfpm package -f nfpm.yaml -p deb -t build/
          VERSION="$v" ./nfpm package -f nfpm.yaml -p rpm -t build/
      - name: Install each package and run it as a NON-ROOT user
        run: |
          set -euo pipefail
          v="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' sluice/__init__.py)"
          # Pinned by digest, like every image this repo depends on: a floating tag would make
          # a distro change indistinguishable from a package regression.
          deb_img=debian@sha256:04634311a8d5fc442b6eb06d792293c4f3e2268652ca7634e00ce8ef5cc0a28a
          rpm_img=fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          docker run --rm -v "$PWD:/w" -w /w -e V="$v" "$deb_img" bash -eux -c '
            apt-get update -qq && apt-get install -y -qq python3 >/dev/null
            apt-get install -y -qq ./build/*.deb >/dev/null
            useradd -m smoke
            install -m 0644 scripts/smoke_installed.py /tmp/smoke.py
            # PYTHONPATH: the package unpacks the wheel to /usr/lib/job-sluice rather
            # than system site-packages, so `import sluice` needs pointing at it.
            cd /tmp && runuser -u smoke -- env PYTHONPATH=/usr/lib/job-sluice \
              python3 /tmp/smoke.py "$V" --channel ci-deb-nonroot'
          docker run --rm -v "$PWD:/w" -w /w -e V="$v" "$rpm_img" bash -eux -c '
            dnf install -y -q python3 shadow-utils util-linux >/dev/null
            dnf install -y -q ./build/*.rpm >/dev/null
            useradd -m smoke
            install -m 0644 scripts/smoke_installed.py /tmp/smoke.py
            # PYTHONPATH: the package unpacks the wheel to /usr/lib/job-sluice rather
            # than system site-packages, so `import sluice` needs pointing at it.
            cd /tmp && runuser -u smoke -- env PYTHONPATH=/usr/lib/job-sluice \
              python3 /tmp/smoke.py "$V" --channel ci-rpm-nonroot'

  ci-success:
    needs: [lint, test, rulesync, docker, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = success ] && \
          [ "${{ needs.test.result }}" = success ] && \
          [ "${{ needs.rulesync.result }}" = success ] && \
          [ "${{ needs.docker.result }}" = success ] && \
          [ "${{ needs.packages.result }}" = success ]
