name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check sluice tests scripts
      - run: pip install --require-hashes -r .github/zizmor-requirements.txt
      - run: zizmor --offline --strict-collection .github/workflows/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # ".[test]" pulls pytest AND faker: the suite generates its own synthetic
      # job titles rather than hardcoding anyone's real role preferences.
      - run: pip install -e ".[test]"
      - run: python -m pytest

  rulesync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # --ignore-scripts: one package in the pinned tree declares a postinstall. It is
      # env-gated and does not fetch by default, but it executes outside the lockfile's
      # determination -- exactly what the lockfile is here to rule out.
      - run: npm ci --ignore-scripts
      - run: |
          set -euo pipefail
          npm run rulesync | tee "$RUNNER_TEMP/rulesync-output.txt"
          python scripts/guard_rulesync_drift.py "$RUNNER_TEMP/rulesync-output.txt"
          # CONTENT assertions the drift guard structurally cannot make. It counts FILES, and
          # a count is IDENTICAL whether or not the hook it counted carries a command, and
          # identical whether the agents emitted are this repo's or somebody else's. Only the
          # emitted artifact can tell those apart, and this job is the first environment where
          # node exists and the generator has actually run -- so assert it here. None of it can
          # live in the pytest suite, which is offline and never shells out to npm.
          #
          # STRUCTURAL, not a grep. `grep -q guard_no_bypass.py .claude/settings.json` only
          # proves the STRING is in the file: a rulesync that re-nested the command under a
          # different event, or under none, still matches while Claude Code -- which reads
          # exactly one path -- runs nothing. So the PATH is what gets asserted.
          #
          # The agent and skill NAMES are checked for the same reason the hook command is. The
          # five subagents and four skills are this repo's merge gate; a renamed or dropped one
          # is a review that silently never runs, and the count stays 5 and 4 throughout.
          python - <<'PY'
          import json
          import pathlib
          import sys

          settings = json.loads(pathlib.Path(".claude/settings.json").read_text(encoding="utf-8"))
          commands = [
              hook.get("command", "")
              for matcher in settings.get("hooks", {}).get("PreToolUse", [])
              for hook in matcher.get("hooks", [])
          ]
          if not any("guard_no_bypass.py" in command for command in commands):
              sys.exit(
                  "rulesync emitted .claude/settings.json, but no guard_no_bypass.py command "
                  "sits under hooks.PreToolUse[*].hooks[*].command.\n"
                  f"  commands found at that path: {commands}\n"
                  "Either the command was dropped, or this rulesync version nests hooks "
                  "somewhere else. Both ship the no-bypass guard INERT -- Claude Code reads "
                  "that path and nothing else, so a command sitting anywhere else in the file "
                  "never runs. Re-verify .rulesync/hooks.json against this version's hook "
                  "schema before touching anything else."
              )

          for label, emitted, source in (
              ("agents",
               {p.stem for p in pathlib.Path(".claude/agents").glob("*.md")},
               {p.stem for p in pathlib.Path(".rulesync/subagents").glob("*.md")}),
              ("skills",
               {p.name for p in pathlib.Path(".claude/skills").glob("*/") if p.is_dir()},
               {p.name for p in pathlib.Path(".rulesync/skills").glob("*/") if p.is_dir()}),
          ):
              if emitted != source:
                  sys.exit(
                      f"the emitted .claude/{label}/ does not match its .rulesync/ source.\n"
                      f"  in the source but NOT emitted: {sorted(source - emitted)}\n"
                      f"  emitted but NOT in the source: {sorted(emitted - source)}\n"
                      "The file count can match exactly while the names do not. These are the "
                      "review agents and skills this repo's merge gate is built from, so a "
                      "renamed or dropped one is a review that never runs, with nothing red "
                      "anywhere to say so."
                  )
          PY
          # FAIL CLOSED, twice over. `if [ -n "$(git status --porcelain)" ]` DISCARDS the
          # substitution's exit status, and `set -e` is suppressed inside an `if` condition --
          # so a git that cannot run reports a CLEAN tree and a gitignore gap ships green.
          # Assign first, check the status, then test the value.
          if ! dirty=$(git status --porcelain); then
            echo "git status failed -- refusing to certify a clean tree" >&2
            exit 1
          fi
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            exit 1
          fi

  ci-success:
    needs: [lint, test, rulesync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = success ] && \
          [ "${{ needs.test.result }}" = success ] && \
          [ "${{ needs.rulesync.result }}" = success ]
