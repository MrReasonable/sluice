name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check sluice tests scripts
      - run: pip install --require-hashes -r .github/zizmor-requirements.txt
      - run: zizmor --offline --strict-collection .github/workflows/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # ".[test]" pulls pytest, faker AND pytest-cov: the suite generates its own synthetic
      # job titles rather than hardcoding anyone's real role preferences, and #11 asks CI to
      # report what the suite covers.
      - run: pip install -e ".[test]"
      # Bare `--cov`: every knob (source, branch, show_missing) lives in pyproject.toml, so a
      # local `python -m pytest --cov` renders the SAME report. It reports and does not gate --
      # there is no `--cov-fail-under`, deliberately; see the note in pyproject.toml.
      #
      # Run on EVERY matrix leg rather than singling one out. A `if: matrix.python-version ==
      # '3.12'` would be more machinery, not less, and it fails OPEN: bump the matrix past that
      # literal and the condition matches no leg, coverage silently stops being measured, and
      # nothing goes red. And three legs do NOT stack three tables on one page: the variable is
      # per-STEP, and GitHub groups "the summaries for all steps in a job [...] into a single job
      # summary", listing one per job -- so each leg renders its own, and a gap that exists only
      # on one interpreter version becomes visible instead of being averaged away.
      - run: python -m pytest --cov
      # Re-render the SAME data as markdown so the per-file breakdown lands on the run's summary
      # page rather than only in the log.
      #
      # `-u` is the load-bearing flag, and NOT for the reason this comment first gave. An unset
      # $GITHUB_STEP_SUMMARY does not pass silently: the redirect fails on a compound command and
      # the step exits 1 under plain `bash`, no flags needed -- measured. What DOES pass silently
      # is an unset $PYTHON_VERSION, which renders the heading `## Coverage (Python )` and exits
      # 0. `-u` turns that into an unbound-variable error. `-e` is already GitHub's default
      # (`bash -e {0}`); `pipefail` is inert here with no pipe in the block, and is kept only so
      # that adding one later cannot silently swallow a failure the way it could in `rulesync`.
      #
      # No `if: always()` -- on a red suite the failing tests are the signal, and a coverage
      # table rendered from a partial run would understate coverage for reasons unrelated to it.
      - name: Publish the coverage report to the run summary
        # Via env, never interpolated into the script body. `matrix.python-version` is authored
        # here and not attacker-controlled, so this is hygiene rather than a live hole -- but a
        # `${{ }}` inside `run:` is pasted as TEXT before bash ever sees it, and keeping the
        # workflow free of that shape is what stops a later edit reaching for it with something
        # that IS attacker-controlled. zizmor's template-injection audit gates on the same rule.
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          {
            echo "## Coverage (Python $PYTHON_VERSION)"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  rulesync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # --ignore-scripts: one package in the pinned tree declares a postinstall. It is
      # env-gated and does not fetch by default, but it executes outside the lockfile's
      # determination -- exactly what the lockfile is here to rule out.
      - run: npm ci --ignore-scripts
      - run: |
          set -euo pipefail
          # `.claude/settings.json` is the one rulesync output this repo tracks (it also
          # carries Claude Code's hand-authored `enabledPlugins` key), so the checkout always
          # supplies a copy before generation runs. Clearing its `hooks` key first forces
          # rulesync to rewrite that key fresh every run -- without it, a copy that already
          # matches gets silently SKIPPED and omitted from the summary, breaking the exact
          # count guard below; and a genuinely broken generate run would leave a stale but
          # structurally-valid copy in place, defeating the emitted-content guard after it.
          # scripts/reset_tracked_hooks.py's own docstring has the measured chain.
          python3 scripts/reset_tracked_hooks.py .
          npm run rulesync | tee "$RUNNER_TEMP/rulesync-output.txt"
          python scripts/guard_rulesync_drift.py "$RUNNER_TEMP/rulesync-output.txt"
          # The one content assertion the drift guard structurally cannot make: it counts
          # FILES, and a count is identical whether or not the hook it counted carries a
          # command. Only the emitted artifact can tell, and this job is the first environment
          # where node exists and the generator has actually run. It cannot live in the pytest
          # suite, which is offline and never shells out to npm. The check lives in a SCRIPT,
          # not a heredoc: an inline interpreter block is invisible to `ruff check`, cannot be
          # unit-tested, and leaves a step whose command says nothing about what it does.
          # Its docstring records why it checks ONLY the hook and deliberately stops there.
          python scripts/guard_emitted_outputs.py .
          # FAIL CLOSED, twice over. `if [ -n "$(git status --porcelain)" ]` DISCARDS the
          # substitution's exit status, and `set -e` is suppressed inside an `if` condition --
          # so a git that cannot run reports a CLEAN tree and a gitignore gap ships green.
          # Assign first, check the status, then test the value.
          if ! dirty=$(git status --porcelain); then
            echo "git status failed -- refusing to certify a clean tree" >&2
            exit 1
          fi
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            exit 1
          fi

  # A REAL `docker build` on every pull request, single-arch and never pushed (#104 PR 4).
  #
  # WHY THIS EXISTS: the release workflow's `docker` job is gated on `release_created`, so its
  # first ever execution would be AFTER the tag is public. That is not hypothetical -- `build`
  # and `twine check --strict` had exactly that shape until 1.0.0, and their first real run came
  # after the release was cut. A broken Dockerfile discovered there is a publicly visible,
  # partially-failed release; discovered here it is a red check on a pull request.
  #
  # No `paths:` filter, deliberately. `ci-success` is the required check for the `qa-gates`
  # ruleset, and a path-filtered job makes that check dishonest on every run where it does not
  # fire. The cost is a few minutes per PR, which is the cheaper side of that trade.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Deliberately NOT `pip install --require-hashes -r .github/build-requirements.txt`, which
      # is what the release `build` job uses. This wheel is a smoke fixture that is discarded at
      # the end of the job, not an artefact anyone publishes, so hash-pinning it would couple a
      # pull-request check to the release supply chain for no property gained -- and would create
      # a THIRD copy of the release build sequence, firing the composite-action extraction the
      # PyPI PR deliberately deferred. `tests/test_ci_wiring.py` asserts this job does not
      # reference that file, so "make CI consistent with the release build" cannot be taken
      # silently.
      - run: pip install build
      - run: python -m build --wheel
      - run: docker build -t job-sluice:ci .
      - name: Smoke -- the console script runs
        run: docker run --rm job-sluice:ci --version
      # The highest-value assertion in this job. WeasyPrint links natively against cairo/pango,
      # which `--version` never touches, so an image missing every system library still passes
      # the step above. It covers ALL FOUR baked extras rather than `render` alone because
      # `pip install` only WARNS on an unknown extra -- a typo'd or renamed one would otherwise
      # ship an image silently missing google, mcp or completion with nothing red anywhere.
      - name: Smoke -- every baked extra imports, system libraries included
        run: docker run --rm --entrypoint python job-sluice:ci -c "import weasyprint, jinja2, googleapiclient, mcp, argcomplete"
      # `doctor` exits 1 in ANY container by design: DoctorReport.exit_code() returns 1 whenever
      # a check is DEAD, and claude-max is DEAD whenever the `claude` CLI is absent from PATH,
      # which it always is here. So the status is asserted in NEITHER direction -- 0 would fail
      # every run, and 1 would pin a degraded state as correct and start lying the moment a check
      # changed. It is captured rather than discarded with a trailing `|| true`, because a bare
      # "no traceback" negative passes against a container that prints nothing or dies before
      # doctor runs at all; the report must be positively present too.
      - name: Smoke -- doctor renders its report
        run: |
          set -uo pipefail
          if out="$(docker run --rm job-sluice:ci doctor --offline 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$out"
          case "$out" in
            *"job-sluice doctor"*) ;;
            *) echo "::error::doctor emitted no report (exit $status) -- the image is broken, not merely degraded"; exit 1 ;;
          esac
          case "$out" in
            *Traceback*) echo "::error::doctor raised inside the image (exit $status)"; exit 1 ;;
          esac

  ci-success:
    needs: [lint, test, rulesync, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = success ] && \
          [ "${{ needs.test.result }}" = success ] && \
          [ "${{ needs.rulesync.result }}" = success ] && \
          [ "${{ needs.docker.result }}" = success ]
