name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check sluice tests scripts
      - run: pip install --require-hashes -r .github/zizmor-requirements.txt
      - run: zizmor --offline --strict-collection .github/workflows/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # ".[test]" pulls pytest AND faker: the suite generates its own synthetic
      # job titles rather than hardcoding anyone's real role preferences.
      - run: pip install -e ".[test]"
      - run: python -m pytest

  rulesync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # --ignore-scripts: one package in the pinned tree declares a postinstall. It is
      # env-gated and does not fetch by default, but it executes outside the lockfile's
      # determination -- exactly what the lockfile is here to rule out.
      - run: npm ci --ignore-scripts
      - run: |
          set -euo pipefail
          npm run rulesync | tee "$RUNNER_TEMP/rulesync-output.txt"
          python scripts/guard_rulesync_drift.py "$RUNNER_TEMP/rulesync-output.txt"
          # The guard above counts FILES, and a file count cannot see the failure that
          # motivates it: rulesync can write a hook file with no `command` key, print
          # "All done!" and exit 0, so 17 command-less hook files pass. The emitted artifact is
          # the only thing that can tell the difference, and this job is the first environment
          # where node exists and the generator has actually run -- so assert it here. It
          # cannot live in the pytest suite, which is offline and never shells out to npm.
          if ! grep -q 'guard_no_bypass.py' .claude/settings.json; then
            echo "rulesync emitted its hook files but .claude/settings.json carries no" >&2
            echo "guard_no_bypass.py command. The hooks are registered with nothing behind" >&2
            echo "them: the no-bypass guard would ship INERT. Re-verify .rulesync/hooks.json" >&2
            echo "against this rulesync version's hook schema before touching anything else." >&2
            exit 1
          fi
          # FAIL CLOSED, twice over. `if [ -n "$(git status --porcelain)" ]` DISCARDS the
          # substitution's exit status, and `set -e` is suppressed inside an `if` condition --
          # so a git that cannot run reports a CLEAN tree and a gitignore gap ships green.
          # Assign first, check the status, then test the value.
          if ! dirty=$(git status --porcelain); then
            echo "git status failed -- refusing to certify a clean tree" >&2
            exit 1
          fi
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            exit 1
          fi

  ci-success:
    needs: [lint, test, rulesync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = success ] && \
          [ "${{ needs.test.result }}" = success ] && \
          [ "${{ needs.rulesync.result }}" = success ]
