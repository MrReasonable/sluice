name: Release Please

# Runs on every push to main and keeps ONE open release PR, accumulating changes until you
# merge it. Merging is what tags and cuts the GitHub release: the tag and the declared
# version are written by the same tool in the same commit, so they cannot drift.
#
# THE TOKEN IS LOAD-BEARING, and without it this workflow is INERT rather than
# broken-looking. GitHub does not start workflow runs from events raised by the default
# GITHUB_TOKEN, so a release PR opened with it never triggers `ci.yml` (`on: pull_request`)
# and `ci-success` never reports. The `qa-gates` ruleset requires `ci-success` plus one
# approving review with NO bypass actors -- so the PR would open, look healthy, and never
# be mergeable. Measured against the live ruleset, not assumed.
#
# WHY A GITHUB APP RATHER THAN A PAT, which is what this used first. Both trigger
# workflows, so both clear `ci-success`. The difference is WHO AUTHORS the PR. A PAT opens
# it as the repo owner, and GitHub does not let anyone approve their own pull request --
# so with CodeRabbit configured to skip release PRs (see `.coderabbit.yaml`), nothing could
# ever approve one and releases would deadlock. An App opens the PR as the App, so a human
# can review and approve it normally. The gate stays fully intact; the approver just
# changes.
#
# The token is minted PER RUN and never stored. Installation tokens expire after an hour,
# and a stored one would be a secret that is present but invalid -- which is worse than
# absent, because presence is what a fallback tests. Nothing here has a fallback for that
# reason: if the App secrets are missing the run fails loudly at the first step rather than
# opening a PR that cannot be merged.
#
# THE APP INSTALLATION needs `contents: write`, `pull requests: write` and `issues: write`
# -- the last because release-please labels the release PR `autorelease:*` and labels are
# an issues-scoped resource.

on:
  push:
    branches: [main]

# Added deliberately, and not a restore: this workflow shipped without it. Two runs racing
# would both compute a release from the same branch and fight over the same release branch
# ref. `cancel-in-progress: false` because the back half of a release -- tagging, then
# cutting the GitHub release -- must not be interrupted midway; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # No elevated GITHUB_TOKEN permissions: every write below is made with the App
    # installation token, whose scope comes from the App itself. Leaving these at the
    # workflow default keeps the built-in token read-only even if a future step uses it.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          # Scope the minted token DOWN to what release-please needs. Without these it
          # inherits the App installation's blanket permissions -- zizmor flags that as
          # HIGH, and rightly: the App may later be granted something for another purpose
          # and this token would silently gain it too. `issues` is the non-obvious one:
          # labels are issues-scoped, and release-please labels the PR `autorelease:*`.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # `github.sha` on THIS run is the commit that triggered it -- not necessarily the commit
      # release-please just tagged. Those normally coincide, but diverge if a prior run failed
      # after release-please tagged but before build/attest ran: the NEXT push to main is what
      # observes the pending release and runs this workflow, and that run's github.sha is the
      # new push, not the tagged commit. `build` checks out THIS sha so it builds and attests
      # exactly the commit that was tagged, never whatever happened to trigger the run.
      sha: ${{ steps.release.outputs.sha }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/build-requirements.txt
      # --no-isolation: build against the environment just hash-verified above, not a fresh
      # isolated environment that would `pip install` [build-system].requires (setuptools)
      # UNVERIFIED at build time -- see build-requirements.txt's header for the full reasoning.
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  attest:
    needs: [release-please, build]
    # success() is belt-and-suspenders, not load-bearing on its own: GitHub Actions already
    # ANDs an implicit success() into any custom `if:` that doesn't name a status function
    # (verified against GitHub's own docs), so a failed `build` would skip this job even
    # without it. Spelled out anyway, for the same reason the == 'true' string comparison
    # below is spelled out rather than left implicit -- so a future reader doesn't mistake it
    # for redundant noise and "clean it up." Contrast `ci.yml`'s ci-success, which uses
    # `if: always()` specifically to BYPASS this same default because it must run and report
    # even when its dependencies failed; this job's default (skip on failure) is the one it
    # wants.
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Neither elevated permission below is requested on `build` -- keeping them here means the
    # job that runs the project's own build backend (`python -m build`, an arbitrary-code-
    # execution surface: it executes this repo's build backend and whatever it pulls in) never
    # itself holds the permissions that sign a provenance claim. That is also why attest is a
    # separate job rather than folded into build's steps: a job boundary is what makes the
    # permissions split enforceable, since permissions are granted per job, not per step.
    # No `contents:` key here, deliberately. A job-level `permissions:` block is exhaustive, not
    # additive -- GitHub sets every permission not named here to `none`, so this job gets NO
    # contents access at all, narrower than the workflow-wide `contents: read` default it would
    # otherwise inherit. That is correct: this job only downloads build's already-built artifact
    # and never checks out or reads repository source, so it has no use for one.
    permissions:
      id-token: write  # mints the OIDC token attest-build-provenance exchanges for a Sigstore cert
      attestations: write  # lets attest-build-provenance attach the attestation to this repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
