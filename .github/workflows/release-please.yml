name: Release Please

# Runs on every push to main and keeps ONE open release PR, accumulating changes until you
# merge it. Merging is what tags and cuts the GitHub release: the tag and the declared
# version are written by the same tool in the same commit, so they cannot drift.
#
# THE TOKEN IS LOAD-BEARING, and without it this workflow is INERT rather than
# broken-looking. GitHub does not start workflow runs from events raised by the default
# GITHUB_TOKEN, so a release PR opened with it never triggers `ci.yml` (`on: pull_request`)
# and `ci-success` never reports. The `qa-gates` ruleset requires `ci-success` plus one
# approving review with NO bypass actors -- so the PR would open, look healthy, and never
# be mergeable. Measured against the live ruleset, not assumed.
#
# WHY A GITHUB APP RATHER THAN A PAT, which is what this used first. Both trigger
# workflows, so both clear `ci-success`. The difference is WHO AUTHORS the PR. A PAT opens
# it as the repo owner, and GitHub does not let anyone approve their own pull request --
# so with CodeRabbit configured to skip release PRs (see `.coderabbit.yaml`), nothing could
# ever approve one and releases would deadlock. An App opens the PR as the App, so a human
# can review and approve it normally. The gate stays fully intact; the approver just
# changes.
#
# The token is minted PER RUN and never stored. Installation tokens expire after an hour,
# and a stored one would be a secret that is present but invalid -- which is worse than
# absent, because presence is what a fallback tests. Nothing here has a fallback for that
# reason: if the App secrets are missing the run fails loudly at the first step rather than
# opening a PR that cannot be merged.
#
# THE APP INSTALLATION needs `contents: write`, `pull requests: write` and `issues: write`
# -- the last because release-please labels the release PR `autorelease:*` and labels are
# an issues-scoped resource.

on:
  push:
    branches: [main]

# Added deliberately, and not a restore: this workflow shipped without it. Two runs racing
# would both compute a release from the same branch and fight over the same release branch
# ref. `cancel-in-progress: false` because the back half of a release -- tagging, then
# cutting the GitHub release -- must not be interrupted midway; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # No elevated GITHUB_TOKEN permissions: every write below is made with the App
    # installation token, whose scope comes from the App itself. Leaving these at the
    # workflow default keeps the built-in token read-only even if a future step uses it.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          # Scope the minted token DOWN to what release-please needs. Without these it
          # inherits the App installation's blanket permissions -- zizmor flags that as
          # HIGH, and rightly: the App may later be granted something for another purpose
          # and this token would silently gain it too. `issues` is the non-obvious one:
          # labels are issues-scoped, and release-please labels the PR `autorelease:*`.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # `github.sha` on THIS run is the commit that triggered it -- not necessarily the commit
      # release-please just tagged. Those normally coincide, but diverge if a prior run failed
      # after release-please tagged but before build/attest ran: the NEXT push to main is what
      # observes the pending release and runs this workflow, and that run's github.sha is the
      # new push, not the tagged commit. `build` checks out THIS sha so it builds and attests
      # exactly the commit that was tagged, never whatever happened to trigger the run.
      sha: ${{ steps.release.outputs.sha }}
      # Read by `release-assets` to name the release it uploads to. Flat and un-prefixed
      # because release-please-config.json declares ONE package at path "." with
      # include-component-in-tag: false -- the same property `release_created` relies on.
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Read by `docker` to build its X.Y.Z / X.Y / latest tag set (#104 PR 4). Flat and
      # un-prefixed for the same reason `tag_name` is: release-please-config.json declares ONE
      # package at path "." with include-component-in-tag: false. Computing the tags from these
      # rather than from docker/metadata-action keeps one fewer action pinned, and puts the
      # values in a `with:` input rather than a `run:` body, which is what zizmor's
      # template-injection audit requires.
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/build-requirements.txt
      # --no-isolation: build against the environment just hash-verified above, not a fresh
      # isolated environment that would `pip install` [build-system].requires (setuptools)
      # UNVERIFIED at build time -- see build-requirements.txt's header for the full reasoning.
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # 7 days, not 1, because #104 made this artifact the input to an IRREVERSIBLE
          # step. `pypi` and `release-assets` both consume it, and a PyPI upload cannot be
          # withdrawn. If `pypi` fails at its first real execution -- most likely because
          # the trusted-publisher entry does not exist yet, or names the wrong workflow
          # filename -- the ONLY automated recovery is re-running that failed job while
          # this artifact still exists. Re-running the whole workflow does NOT work:
          # release-please sees the release already cut, `release_created` comes back
          # `false`, and `build` never runs to produce a new one. A 24-hour window on that
          # is too tight for a failure whose diagnosis is a manual pypi.org configuration
          # step.
          retention-days: 7

  linux-packages:
    needs: [release-please, build]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # `contents: read` is needed here and is NOT redundant with the workflow default, for the
    # reason `docker` states at length: a job-level block is exhaustive, so this job needs the
    # key named explicitly or the checkout below fails. It DOES check out, unlike
    # `pypi`/`attest`/`release-assets`, because nfpm.yaml, packaging/job-sluice and the staging
    # script are repository source rather than built artefacts.
    #
    # It writes nothing back. The packages leave as an artifact and `release-assets` uploads
    # them, so that job remains THE only holder of `contents: write` in this workflow -- the
    # property its own comment claims, which a second uploading job here would quietly falsify.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit release-please TAGGED, for the same reason `build` and `docker` pin it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # nfpm is a Go binary, so `pip install --require-hashes -r ...` -- this repo's pattern for
      # ruff, zizmor and build -- does not transfer. The same GUARANTEE is spelled out instead:
      # download, verify against a pinned SHA-256, and only then execute. The version and the
      # digest are ONE unit; bumping either alone fails closed at the checksum rather than
      # silently running an unverified binary. The digest below was verified by downloading the
      # release tarball and hashing it independently, not copied from the release page.
      #
      # `sha256sum --check --strict` is what makes this load-bearing. Without --check the hash
      # would merely be PRINTED and the step would pass on any bytes at all, which is exactly
      # the present-and-inert shape this repo keeps closing elsewhere.
      - name: Fetch and verify nfpm
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum --check --strict -
          tar -xzf nfpm.tar.gz nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
      # Unpacks the wheel `build` produced into the tree nfpm.yaml copies to /usr/lib/job-sluice.
      # Asserts there is exactly ONE wheel and that it contained a sluice/ package -- see the
      # script's header; both failures are otherwise silent and produce an installable package
      # that dies on ImportError at every invocation.
      - run: python scripts/build_linux_packages.py
      # VERSION reaches nfpm.yaml's `version: ${VERSION}` through the environment rather than
      # being interpolated into the run body -- the house rule ci.yml states and zizmor's
      # template-injection audit gates on. release-please's own output, so the package version
      # and the git tag cannot disagree.
      - run: ./nfpm package -f nfpm.yaml -p deb -t build/
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
      - run: ./nfpm package -f nfpm.yaml -p rpm -t build/
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
      # Inspect what nfpm actually EMITTED, not what it was asked to emit.
      #
      # This exists because the reverse shipped once. An earlier revision set a blanket
      # `file_info.mode: 0644` on nfpm.yaml's tree entry; nfpm applied it to the directories it
      # synthesises as well, so every directory under /usr/lib/job-sluice lost its search bit
      # and `import sluice` failed for every non-root user. The offline suite could not see it
      # (it asserts what the stager produces, not what nfpm packages) and neither could three
      # container installs, because they ran as root, who bypasses directory traversal checks.
      #
      # A umask-022 runner also makes the stager's chmod a no-op, so CI never exercises the
      # difference. This step is the only place the SHIPPED artefact's directory modes are
      # checked at all.
      - name: Verify the packaged directories stay traversable
        run: |
          set -euo pipefail
          fail=0
          # EXACT drwxr-xr-x, not merely "has an owner search bit". An earlier version tested
          # `!~ /^drwx/`, which accepts drwx------ -- owner-traversable and unusable by anyone
          # else, which is the very failure this step exists to catch, one permission column
          # over. Exact is also the right strength here rather than "x for all three": the
          # stager produces 0755 and nothing else, both packages contain exactly that one
          # directory mode, so any deviation means something changed that nobody intended.
          for deb in build/*.deb; do
            bad=$(dpkg-deb -c "$deb" | awk '$1 ~ /^d/ && substr($1, 1, 10) != "drwxr-xr-x" { print }')
            if [ -n "$bad" ]; then
              echo "::error::$deb ships directories that are not drwxr-xr-x:"; echo "$bad"; fail=1
            fi
          done
          for rpm in build/*.rpm; do
            bad=$(rpm -qlvp "$rpm" | awk '$1 ~ /^d/ && substr($1, 1, 10) != "drwxr-xr-x" { print }')
            if [ -n "$bad" ]; then
              echo "::error::$rpm ships directories that are not drwxr-xr-x:"; echo "$bad"; fail=1
            fi
          done
          exit "$fail"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
          # Fail HERE rather than downstream. The default is `warn`, which per the action's own
          # action.yml means "output a warning but do not fail" -- it creates no artifact at
          # all. So the run does not go green on an empty release: `attest` and
          # `release-assets` both fail at `download-artifact` with "Unable to find an artifact
          # with the name: linux-packages". What `error` buys is WHERE and WHAT the failure
          # says -- at the producer, naming the glob that matched nothing, instead of two jobs
          # later as a missing-artifact error that reads like an infrastructure fault. (An
          # earlier revision of this comment claimed `warn` uploads an empty artifact and lets
          # the release ship silently. That is false, and the claim outlived a review round.)
          if-no-files-found: error
          # 7 days, matching `dist` and for the same reason: this artifact feeds
          # `release-assets`, and re-running that job after a failure is the only automated
          # recovery once release-please has already cut the release.
          retention-days: 7

  attest:
    needs: [release-please, build, linux-packages]
    # success() is belt-and-suspenders, not load-bearing on its own: GitHub Actions already
    # ANDs an implicit success() into any custom `if:` that doesn't name a status function
    # (verified against GitHub's own docs), so a failed `build` would skip this job even
    # without it. Spelled out anyway, for the same reason the == 'true' string comparison
    # below is spelled out rather than left implicit -- so a future reader doesn't mistake it
    # for redundant noise and "clean it up." Contrast `ci.yml`'s ci-success, which uses
    # `if: always()` specifically to BYPASS this same default because it must run and report
    # even when its dependencies failed; this job's default (skip on failure) is the one it
    # wants.
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Neither elevated permission below is requested on `build` -- keeping them here means the
    # job that runs the project's own build backend (`python -m build`, an arbitrary-code-
    # execution surface: it executes this repo's build backend and whatever it pulls in) never
    # itself holds the permissions that sign a provenance claim. That is also why attest is a
    # separate job rather than folded into build's steps: a job boundary is what makes the
    # permissions split enforceable, since permissions are granted per job, not per step.
    # No `contents:` key here, deliberately. A job-level `permissions:` block is exhaustive, not
    # additive -- GitHub sets every permission not named here to `none`, so this job gets NO
    # contents access at all, narrower than the workflow-wide `contents: read` default it would
    # otherwise inherit. That is correct: this job only downloads build's already-built artifact
    # and never checks out or reads repository source, so it has no use for one.
    permissions:
      id-token: write  # mints the OIDC token attest-build-provenance exchanges for a Sigstore cert
      attestations: write  # lets attest-build-provenance attach the attestation to this repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The .deb and .rpm are attested HERE rather than in their own job, unlike the image.
      # `attest-image`'s separate existence is about keeping a registry credential and an OIDC
      # identity out of the same job; these packages are plain files this job already has the
      # shape to sign, so a third near-identical job would add a roster entry and a permissions
      # pin to maintain and buy no separation. The cost is that `attest` no longer starts in
      # parallel with `linux-packages` -- accepted, so that no published release asset ships
      # without provenance while its siblings carry it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: packages/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            packages/*

  pypi:
    needs: [release-please, build]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The environment is half of the trusted publisher's claim on pypi.org: the publisher
    # entry names owner/repo/workflow-filename AND this environment, and a mismatch fails
    # the OIDC exchange with `invalid-publisher` rather than falling back to anything.
    environment: pypi
    # No `contents:` key, deliberately. A job-level block is exhaustive, so this job holds
    # id-token and NOTHING else -- narrower than the workflow-wide `contents: read` it would
    # otherwise inherit. It downloads an already-built artifact and never reads repo source.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Three inputs are left at their defaults, each deliberately:
      #   skip-existing (false) -- a duplicate upload must FAIL, never silently no-op.
      #   attestations (true)   -- PEP 740 attestations on the PyPI-hosted files. NOT a
      #                            duplicate of the `attest` job, which attaches Sigstore
      #                            build provenance to this REPO. Different store, different
      #                            verifier. This is also why `pypi` does not need `attest`:
      #                            a published file is attested either way, so serialising
      #                            would buy nothing and let a flaky attest block a release.
      #                            If attestations is ever turned off, revisit that.
      #   repository-url        -- unset means real PyPI. Pinned by a test paired with
      #                            testpypi.yml's, because getting it wrong is catastrophic.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-assets:
    # `linux-packages` is a HARD dependency, and the cost is worth stating: if nfpm, the curl
    # or the checksum fails, this job is skipped and the public release carries NO assets at
    # all -- not the wheel, not the sdist -- while `pypi` has already published, since it does
    # not depend on packaging. That is the deliberate trade: the alternative (uploading
    # whatever happens to exist) publishes a release whose asset list silently varies by which
    # jobs succeeded, and a partial release is harder to notice than an empty one. Recovery is
    # re-running this job while `build`'s 7-day artifact still exists, which is the same
    # recovery path `build`'s own retention comment describes.
    needs: [release-please, build, linux-packages]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The only job in this workflow holding contents: write ON THIS WORKFLOW'S OWN
    # GITHUB_TOKEN, and it holds it for one API call. The release-please App token is
    # deliberately NOT reused: uploading an asset to a release in this same repo is exactly
    # what the built-in GITHUB_TOKEN is for, and minting an installation token would widen the
    # blast radius of a job needing nothing else. `homebrew` below ALSO ends up holding
    # `contents: write`, but that is a SEPARATELY minted GitHub App token, scoped to a
    # DIFFERENT repository (the public tap) -- not this workflow's GITHUB_TOKEN -- so it does
    # not contradict "only job", which is a claim about this token, in this repo.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: packages/
      # No --clobber: an asset that already exists means something already uploaded, which
      # should surface rather than be silently overwritten -- the same reasoning as
      # skip-existing on `pypi`.
      #
      # GH_REPO is load-bearing. `gh` resolves the repo from --repo, then GH_REPO, then the
      # cwd's git remotes, and never GITHUB_REPOSITORY. This job has no checkout, so without
      # it `gh` cannot determine a base repository and fails AFTER the release is public.
      # Both values go through env: rather than being interpolated into the script body --
      # the house rule ci.yml already states, which zizmor's template-injection audit gates on.
      - run: gh release upload "$TAG" dist/* packages/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  docker:
    needs: [release-please, build]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # `contents: read` is needed here and is NOT redundant with the workflow default: a job-level
    # block is exhaustive, so naming `packages: write` alone would set contents to `none` and the
    # checkout below would fail. This job DOES check out, unlike `pypi`/`attest`/`release-assets`,
    # because the Dockerfile is repository source rather than a built artefact.
    permissions:
      contents: read
      packages: write
    # Exposed so `attest-image` can sign the digest that was actually pushed. `id:` on the step
    # alone is NOT enough -- step outputs do not cross a job boundary, and without this mapping
    # `needs.docker.outputs.digest` is empty and the attestation would sign nothing.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit release-please TAGGED, not whatever triggered the run -- the same reason
          # `build` pins it. The Dockerfile must come from the tagged tree.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          # `path: dist/` is load-bearing, not decoration: the Dockerfile's `COPY dist/*.whl` and
          # .dockerignore's `!dist/*.whl` both name that exact directory, and without it the
          # artifact unpacks into the workspace root where the build context cannot see it.
          path: dist/
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # X.Y.Z, X.Y and latest, from release-please's own outputs rather than from
          # docker/metadata-action: one fewer action to pin, and the values land in a `with:`
          # input rather than a `run:` body, which is what zizmor's template-injection audit wants.
          tags: |
            ghcr.io/mrreasonable/job-sluice:${{ needs.release-please.outputs.version }}
            ghcr.io/mrreasonable/job-sluice:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            ghcr.io/mrreasonable/job-sluice:latest
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            REVISION=${{ needs.release-please.outputs.sha }}

  attest-image:
    needs: [release-please, docker]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # A SEPARATE job -- but NOT for the reason the `attest` job above gives for itself, and the
    # difference is worth stating because an earlier draft of this job claimed it was.
    #
    # `attest`'s reasoning is that `python -m build --no-isolation` runs the build backend in the
    # RUNNER's own process, where ACTIONS_ID_TOKEN_REQUEST_TOKEN and _URL are in reach, so a
    # hostile dependency could mint an OIDC token if `build` held `id-token: write`. A BuildKit
    # `RUN` step has none of that environment, so that argument does NOT transfer to this job.
    #
    # What holds instead is narrower and is actually enforced by the suite rather than argued
    # here: `docker` holds no `id-token`, this job holds no `packages`, every job in this file
    # has an exact `_permissions_block` equality pin, and `_RELEASE_PLEASE_JOBS` pins the roster
    # -- so a future job holding a registry credential AND an OIDC identity together cannot land
    # without a human editing both pins deliberately.
    #
    # No `packages:` key: the attestation is repo-side (Sigstore, verifiable with
    # `gh attestation verify oci://...`), so nothing is written back to the registry and this job
    # holds no registry access at all. No `contents:` key either -- it checks nothing out.
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # subject-name AND subject-digest: an OCI subject is not identified by digest alone,
          # and the name is what `gh attestation verify oci://...` matches against.
          subject-name: ghcr.io/mrreasonable/job-sluice
          subject-digest: ${{ needs.docker.outputs.digest }}

  homebrew:
    # `needs: pypi` is an ORDERING CONSTRAINT, not style: the formula's `url` is a PyPI sdist,
    # so it cannot resolve until that upload has landed. This is the workflow's first
    # cross-channel dependency.
    needs: [release-please, pypi]
    if: success() && needs.release-please.outputs.release_created == 'true'
    # RECOVERY, stated like every other channel job in this file: re-run THIS failed job.
    # `needs.release-please.outputs.version` and the PyPI upload this job's own `needs: pypi`
    # depends on both already exist from the run that got this far, so re-running just
    # `homebrew` re-verifies and re-pushes against the SAME release; it does not need `build`
    # or `pypi` to run again.
    #
    # Dispatching `Homebrew dry run` afterwards is explicitly NOT a substitute recovery path.
    # That workflow always sets PUSH_TARGET: auto (see homebrew_verify.sh's PUSH_TARGET
    # comment), which once the tap already holds a formula for an EARLIER version always
    # resolves to a bump-$VERSION scratch branch nothing merges. So after a failed
    # release-time bump, the dry run goes green -- render, audit, install and test all pass --
    # while `brew install` keeps serving whatever version the tap's default branch was last
    # pushed at. The only correct recovery is re-running THIS job, which sets
    # PUSH_TARGET: default.
    # macOS is not a preference. The payoff this channel exists for -- WeasyPrint resolving
    # cairo/pango with no DYLD_FALLBACK_LIBRARY_PATH -- comes from Homebrew's CPython patching
    # Lib/ctypes/macholib/dyld.py, which is a macOS mechanism. Verifying on Linux would prove
    # nothing about what ships.
    runs-on: macos-latest
    # Justified rather than copied: this job DOES check out, for the renderer script. The tap
    # is NOT checked out -- see the step below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      # NO token in this step's environment. It runs `brew install --build-from-source`, which
      # executes the pip/PEP 517 build backend of every one of the ~45 resource sdists in the
      # closure -- a compromised transitive build dependency here must not see a live
      # `contents: write` token for the public tap. See homebrew_verify.sh's header.
      - name: Render, resource-fill, audit, install and test the formula
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          # The SAME fact the App-token step below mints against (`owner:`), passed once here
          # rather than hardcoded a second time in the shell scripts -- see homebrew_verify.sh's
          # TAP_OWNER comment.
          TAP_OWNER: ${{ github.repository_owner }}
          # Always the tap's default branch: nothing merges a bump-X.Y.Z branch, and `brew
          # install` resolves a tap's default branch, so a release must never land anywhere
          # else. See homebrew_verify.sh's PUSH_TARGET comment for the full reasoning.
          PUSH_TARGET: default
        run: bash .github/scripts/homebrew_verify.sh
      # Minted only AFTER the untrusted build above has already run, and used by nothing but
      # the push step immediately below.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - name: Commit and push the verified formula
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: bash .github/scripts/homebrew_push.sh

  post-release:
    # Dispatches `post-release.yml`, which installs each PUBLISHED artefact from its real
    # registry and runs it as an ordinary user.
    #
    # `needs:` IS THE ORDERING, and it names one producing job per channel that workflow
    # checks: `pypi` for the PyPI channel, `docker` for the ghcr image, and `release-assets`
    # for the .deb and .rpm, because that is the job which uploads them to the release -- which
    # is where the check fetches them from. `linux-packages` BUILDS them and is deliberately
    # not named: it is already `release-assets`'s own `needs:`, and naming the builder rather
    # than the publisher would be the same off-by-one this job exists to fix.
    #
    # `post-release.yml` used to trigger on `release: published` and raced all three, because
    # the release is cut by `release-please` -- the FIRST job here -- and every publish hangs
    # off it. It was red on every release up to #231 -- no version list here on purpose, the
    # one that stood here had already gone stale.
    #
    # `homebrew` is deliberately absent. The check does not exercise that channel (this
    # workflow's own `homebrew` job renders, audits, installs and tests the formula before the
    # tap is pushed), so waiting on it would delay the check and couple it to a failure in a
    # channel it never looks at. `tests/test_release_publish_wiring.py` pins that
    # correspondence from both ends so a new channel cannot be checked without being waited on.
    needs: [release-please, pypi, docker, release-assets]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # `workflow_dispatch` is one of exactly two events that STILL start a run when triggered
      # with the built-in GITHUB_TOKEN -- every other event it triggers is suppressed, to stop
      # a workflow re-triggering itself. So no App token is needed here, and this job holds the
      # narrowest permission in the file: it cannot read contents, only start a workflow.
      actions: write
    steps:
      # No checkout. `gh workflow run` addresses the workflow by name through `--repo`, so
      # nothing from the tree is needed -- and a checkout here would put a token in reach of
      # a job whose whole body is one dispatch.
      - name: Dispatch the post-release install check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `--raw-field`, not `--field`: `-F/--field` respects `@` syntax and would read a
          # value beginning with `@` as a FILE to load. The version never starts with `@`, but
          # the flag that cannot misread it is the one to use.
          gh workflow run post-release.yml --repo "$REPO" --raw-field version="$VERSION"
