name: Release Please

# Runs on every push to main and keeps ONE open release PR, accumulating changes until you
# merge it. Merging is what tags and cuts the GitHub release: the tag and the declared
# version are written by the same tool in the same commit, so they cannot drift.
#
# THE TOKEN IS LOAD-BEARING, and without it this workflow is INERT rather than
# broken-looking. GitHub does not start workflow runs from events raised by the default
# GITHUB_TOKEN, so a release PR opened with it never triggers `ci.yml` (`on: pull_request`)
# and `ci-success` never reports. The `qa-gates` ruleset requires `ci-success` plus one
# approving review with NO bypass actors -- so the PR would open, look healthy, and never
# be mergeable. Measured against the live ruleset, not assumed.
#
# WHY A GITHUB APP RATHER THAN A PAT, which is what this used first. Both trigger
# workflows, so both clear `ci-success`. The difference is WHO AUTHORS the PR. A PAT opens
# it as the repo owner, and GitHub does not let anyone approve their own pull request --
# so with CodeRabbit configured to skip release PRs (see `.coderabbit.yaml`), nothing could
# ever approve one and releases would deadlock. An App opens the PR as the App, so a human
# can review and approve it normally. The gate stays fully intact; the approver just
# changes.
#
# The token is minted PER RUN and never stored. Installation tokens expire after an hour,
# and a stored one would be a secret that is present but invalid -- which is worse than
# absent, because presence is what a fallback tests. Nothing here has a fallback for that
# reason: if the App secrets are missing the run fails loudly at the first step rather than
# opening a PR that cannot be merged.
#
# THE APP INSTALLATION needs `contents: write`, `pull requests: write` and `issues: write`
# -- the last because release-please labels the release PR `autorelease:*` and labels are
# an issues-scoped resource.

on:
  push:
    branches: [main]

# Added deliberately, and not a restore: this workflow shipped without it. Two runs racing
# would both compute a release from the same branch and fight over the same release branch
# ref. `cancel-in-progress: false` because the back half of a release -- tagging, then
# cutting the GitHub release -- must not be interrupted midway; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # No elevated GITHUB_TOKEN permissions: every write below is made with the App
    # installation token, whose scope comes from the App itself. Leaving these at the
    # workflow default keeps the built-in token read-only even if a future step uses it.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          # Scope the minted token DOWN to what release-please needs. Without these it
          # inherits the App installation's blanket permissions -- zizmor flags that as
          # HIGH, and rightly: the App may later be granted something for another purpose
          # and this token would silently gain it too. `issues` is the non-obvious one:
          # labels are issues-scoped, and release-please labels the PR `autorelease:*`.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # `github.sha` on THIS run is the commit that triggered it -- not necessarily the commit
      # release-please just tagged. Those normally coincide, but diverge if a prior run failed
      # after release-please tagged but before build/attest ran: the NEXT push to main is what
      # observes the pending release and runs this workflow, and that run's github.sha is the
      # new push, not the tagged commit. `build` checks out THIS sha so it builds and attests
      # exactly the commit that was tagged, never whatever happened to trigger the run.
      sha: ${{ steps.release.outputs.sha }}
      # Read by `release-assets` to name the release it uploads to. Flat and un-prefixed
      # because release-please-config.json declares ONE package at path "." with
      # include-component-in-tag: false -- the same property `release_created` relies on.
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Read by `docker` to build its X.Y.Z / X.Y / latest tag set (#104 PR 4). Flat and
      # un-prefixed for the same reason `tag_name` is: release-please-config.json declares ONE
      # package at path "." with include-component-in-tag: false. Computing the tags from these
      # rather than from docker/metadata-action keeps one fewer action pinned, and puts the
      # values in a `with:` input rather than a `run:` body, which is what zizmor's
      # template-injection audit requires.
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/build-requirements.txt
      # --no-isolation: build against the environment just hash-verified above, not a fresh
      # isolated environment that would `pip install` [build-system].requires (setuptools)
      # UNVERIFIED at build time -- see build-requirements.txt's header for the full reasoning.
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # 7 days, not 1, because #104 made this artifact the input to an IRREVERSIBLE
          # step. `pypi` and `release-assets` both consume it, and a PyPI upload cannot be
          # withdrawn. If `pypi` fails at its first real execution -- most likely because
          # the trusted-publisher entry does not exist yet, or names the wrong workflow
          # filename -- the ONLY automated recovery is re-running that failed job while
          # this artifact still exists. Re-running the whole workflow does NOT work:
          # release-please sees the release already cut, `release_created` comes back
          # `false`, and `build` never runs to produce a new one. A 24-hour window on that
          # is too tight for a failure whose diagnosis is a manual pypi.org configuration
          # step.
          retention-days: 7

  attest:
    needs: [release-please, build]
    # success() is belt-and-suspenders, not load-bearing on its own: GitHub Actions already
    # ANDs an implicit success() into any custom `if:` that doesn't name a status function
    # (verified against GitHub's own docs), so a failed `build` would skip this job even
    # without it. Spelled out anyway, for the same reason the == 'true' string comparison
    # below is spelled out rather than left implicit -- so a future reader doesn't mistake it
    # for redundant noise and "clean it up." Contrast `ci.yml`'s ci-success, which uses
    # `if: always()` specifically to BYPASS this same default because it must run and report
    # even when its dependencies failed; this job's default (skip on failure) is the one it
    # wants.
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Neither elevated permission below is requested on `build` -- keeping them here means the
    # job that runs the project's own build backend (`python -m build`, an arbitrary-code-
    # execution surface: it executes this repo's build backend and whatever it pulls in) never
    # itself holds the permissions that sign a provenance claim. That is also why attest is a
    # separate job rather than folded into build's steps: a job boundary is what makes the
    # permissions split enforceable, since permissions are granted per job, not per step.
    # No `contents:` key here, deliberately. A job-level `permissions:` block is exhaustive, not
    # additive -- GitHub sets every permission not named here to `none`, so this job gets NO
    # contents access at all, narrower than the workflow-wide `contents: read` default it would
    # otherwise inherit. That is correct: this job only downloads build's already-built artifact
    # and never checks out or reads repository source, so it has no use for one.
    permissions:
      id-token: write  # mints the OIDC token attest-build-provenance exchanges for a Sigstore cert
      attestations: write  # lets attest-build-provenance attach the attestation to this repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  pypi:
    needs: [release-please, build]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The environment is half of the trusted publisher's claim on pypi.org: the publisher
    # entry names owner/repo/workflow-filename AND this environment, and a mismatch fails
    # the OIDC exchange with `invalid-publisher` rather than falling back to anything.
    environment: pypi
    # No `contents:` key, deliberately. A job-level block is exhaustive, so this job holds
    # id-token and NOTHING else -- narrower than the workflow-wide `contents: read` it would
    # otherwise inherit. It downloads an already-built artifact and never reads repo source.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Three inputs are left at their defaults, each deliberately:
      #   skip-existing (false) -- a duplicate upload must FAIL, never silently no-op.
      #   attestations (true)   -- PEP 740 attestations on the PyPI-hosted files. NOT a
      #                            duplicate of the `attest` job, which attaches Sigstore
      #                            build provenance to this REPO. Different store, different
      #                            verifier. This is also why `pypi` does not need `attest`:
      #                            a published file is attested either way, so serialising
      #                            would buy nothing and let a flaky attest block a release.
      #                            If attestations is ever turned off, revisit that.
      #   repository-url        -- unset means real PyPI. Pinned by a test paired with
      #                            testpypi.yml's, because getting it wrong is catastrophic.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-assets:
    needs: [release-please, build]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The only job in this workflow holding contents: write, and it holds it for one API
    # call. The release-please App token is deliberately NOT reused: uploading an asset to a
    # release in this same repo is exactly what the built-in GITHUB_TOKEN is for, and
    # minting an installation token would widen the blast radius of a job needing nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # No --clobber: an asset that already exists means something already uploaded, which
      # should surface rather than be silently overwritten -- the same reasoning as
      # skip-existing on `pypi`.
      #
      # GH_REPO is load-bearing. `gh` resolves the repo from --repo, then GH_REPO, then the
      # cwd's git remotes, and never GITHUB_REPOSITORY. This job has no checkout, so without
      # it `gh` cannot determine a base repository and fails AFTER the release is public.
      # Both values go through env: rather than being interpolated into the script body --
      # the house rule ci.yml already states, which zizmor's template-injection audit gates on.
      - run: gh release upload "$TAG" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  docker:
    needs: [release-please, build]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # `contents: read` is needed here and is NOT redundant with the workflow default: a job-level
    # block is exhaustive, so naming `packages: write` alone would set contents to `none` and the
    # checkout below would fail. This job DOES check out, unlike `pypi`/`attest`/`release-assets`,
    # because the Dockerfile is repository source rather than a built artefact.
    permissions:
      contents: read
      packages: write
    # Exposed so `attest-image` can sign the digest that was actually pushed. `id:` on the step
    # alone is NOT enough -- step outputs do not cross a job boundary, and without this mapping
    # `needs.docker.outputs.digest` is empty and the attestation would sign nothing.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit release-please TAGGED, not whatever triggered the run -- the same reason
          # `build` pins it. The Dockerfile must come from the tagged tree.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          # `path: dist/` is load-bearing, not decoration: the Dockerfile's `COPY dist/*.whl` and
          # .dockerignore's `!dist/*.whl` both name that exact directory, and without it the
          # artifact unpacks into the workspace root where the build context cannot see it.
          path: dist/
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # X.Y.Z, X.Y and latest, from release-please's own outputs rather than from
          # docker/metadata-action: one fewer action to pin, and the values land in a `with:`
          # input rather than a `run:` body, which is what zizmor's template-injection audit wants.
          tags: |
            ghcr.io/mrreasonable/job-sluice:${{ needs.release-please.outputs.version }}
            ghcr.io/mrreasonable/job-sluice:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            ghcr.io/mrreasonable/job-sluice:latest
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            REVISION=${{ needs.release-please.outputs.sha }}

  attest-image:
    needs: [release-please, docker]
    if: success() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # A SEPARATE job, for the reason the `attest` job above states for itself: the job that runs
    # the build never holds the permissions that sign a provenance claim, and a job boundary is
    # what makes that split enforceable, since permissions are granted per job and not per step.
    # `docker build` executes a Dockerfile -- apt, pip, and this project's own wheel -- so it is
    # the same arbitrary-code-execution surface `build` is.
    #
    # No `packages:` key: the attestation is repo-side (Sigstore, verifiable with
    # `gh attestation verify oci://...`), so nothing is written back to the registry and this job
    # holds no registry access at all. No `contents:` key either -- it checks nothing out.
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # subject-name AND subject-digest: an OCI subject is not identified by digest alone,
          # and the name is what `gh attestation verify oci://...` matches against.
          subject-name: ghcr.io/mrreasonable/job-sluice
          subject-digest: ${{ needs.docker.outputs.digest }}
