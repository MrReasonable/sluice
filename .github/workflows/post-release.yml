name: Post-release install check

# Installs the PUBLISHED artefact from each real channel and runs it.
#
# `ci.yml` and `tests/test_packaging.py` cover what can be known from the source tree: the
# suite passes, and a wheel built here carries the right metadata, templates and console
# script. Neither can answer the question this workflow asks -- does the thing that reached
# the registry install onto a clean machine and work? Those fail differently: a runtime
# dependency that is declared but not installable, package data the wheel carries and the
# .deb's unpack step drops, an image whose entrypoint is wrong.
#
# It runs AFTER the artefacts are published, and that is deliberate rather than a compromise:
# they do not exist until `release-please.yml` has pushed them, so this cannot gate the release.
# What it can do is say quickly that a published version is broken, which is the difference
# between finding out now and finding out from a user.
#
# `release-please.yml` DISPATCHES IT, and that is the whole of the ordering. This workflow used
# to trigger on `release: published`, which reads as "after the release" and is not: release-
# please cuts the GitHub release in its FIRST job, and every publishing job (`pypi`, `docker`,
# `release-assets`) declares `needs: release-please` and therefore runs after it. The event
# fired at the START of the publish fan-out and this workflow raced it -- measured red on every
# release up to #231. Deliberately NO version list: the one that stood here enumerated three, went
# stale the moment a fourth was cut, and was still being read as current. "no matching
# distribution" from PyPI, 404 for the .deb and .rpm, "manifest unknown" for the image. A check
# that fails on every release is a check nobody reads, which is worse than not having one --
# the next genuine publish failure is indistinguishable from the noise. `release-please.yml`'s
# `post-release` job now names those publishes in its `needs:` and dispatches this workflow
# once they are done, so the ordering is DECLARED where it can be enforced rather than inferred
# from an event name.
#
# NON-ROOT is the point of the deb/rpm jobs. Verifying a Linux package as root cannot see a
# non-root failure and looks identical to success: root bypasses directory traversal checks, so
# a package whose directories are mode `drw-r--r--` works perfectly for root and is unusable
# for everyone else. That shipped here once (#104). `release-please.yml` now checks the modes
# statically with `dpkg-deb -c`/`rpm -qlvp`; importing the package as an ordinary user is the
# direct evidence rather than the proxy.
#
# EVERY `${{ }}` REACHES THE SHELL THROUGH `env`, never inlined into a script body. Expression
# substitution happens before the shell parses, so an inlined value containing a quote runs as
# code -- and validating it afterwards is worthless, because by then it has already run. The
# version is attacker-influenced: it is a `workflow_dispatch` input, typed by whoever runs the
# workflow by hand, or passed through from the tag whoever cut the release chose.

on:
  # The ONLY trigger. `release-please.yml`'s `post-release` job is the caller; see the ordering
  # note above for why `release: published` was removed rather than left alongside it -- kept
  # alongside, it would still fire early and still red every release.
  #
  # Being a dispatch is also what makes this re-runnable by hand against any released version:
  # useful for a release published before this workflow existed, and for re-checking after a
  # registry incident.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to check, e.g. 2.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    # Resolved once and passed down, so every job below checks the SAME version rather than
    # each re-deriving it from the trigger.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${RAW#v}"
          # Fail loudly rather than let every job below run against an empty string, which
          # would make the version check compare "" with "" and pass.
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a version: ${RAW}"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "checking job-sluice $v"

  pypi:
    # Wheel and sdist are separate artefacts that fail differently -- `--no-binary` forces a
    # real build from the sdist, which is how a missing build-time file surfaces.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        form: [wheel, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token is needed here -- the only checked-out file is the smoke script, and
          # every artefact is fetched from a public registry. Leaving credentials in .git
          # would put them in reach of anything this job runs.
          persist-credentials: false
          sparse-checkout: scripts/smoke_installed.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from PyPI and smoke it
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FORM: ${{ matrix.form }}
          PY: ${{ matrix.python }}
        run: |
          set -euo pipefail
          # Run from a directory that is NOT the checkout. Python puts the working directory on
          # sys.path, so running here would import the SOURCE and certify a package it never
          # loaded. `smoke_installed.py` refuses that case outright; not creating it is better
          # than being caught by it.
          smoke="$PWD/scripts/smoke_installed.py"
          work="$(mktemp -d)"; cd "$work"
          python -m venv v
          ./v/bin/pip install --quiet --upgrade pip

          # Wheel and sdist differ ONLY in this flag, and the retry below is SHARED, so the two
          # forms cannot drift into having different propagation tolerances. `--no-binary :all:`
          # forces a real build from the sdist, which is how a missing build-time file surfaces.
          #
          # Positional parameters rather than a bash array: `"${arr[@]}"` on an EMPTY array is an
          # unbound-variable error under `set -u` in bash 3.2 -- which is macOS's /bin/bash, and
          # `tests/test_post_release_wiring.py` EXECUTES this script rather than reading it. `"$@"`
          # is special-cased and expands to nothing. Measured both ways before choosing.
          #
          # EACH ARM PINS ITS FORM, and the `wheel` half is the one that is easy to leave off. A
          # bare `pip install` prefers a wheel but FALLS BACK to building the sdist, and a
          # partially propagated index is exactly the state where one form is present and the
          # other is not -- so `pypi (3.x, wheel)` could report green having never installed a
          # wheel, certifying a channel it did not exercise. That is the failure this whole
          # workflow exists to catch, hiding inside the cell named after it.
          if [ "$FORM" = sdist ]; then
            set -- --no-binary :all:
          else
            set -- --only-binary :all:
          fi

          # PyPI's simple index is eventually consistent across CDN nodes, so a version that
          # uploaded successfully can still be ABSENT from the node this runner happens to reach.
          # Measured on v2.4.2: the upload completed at 15:48:40Z and `pypi (3.13, sdist)` still
          # got "No matching distribution" at 15:53:31Z -- ~5 minutes later -- while every sibling
          # cell installed that same version in the same run. Exactly one cell has failed this
          # way per release, a DIFFERENT one each time (v2.4.1 was `3.14, wheel`), which is the
          # signature of a propagation lag rather than a broken artefact.
          #
          # A bounded retry with backoff rather than a blanket `sleep`: a sleep long enough to be
          # safe is long enough to be wrong, and it hides how long propagation actually took.
          # This REPORTS it -- every attempt logs its elapsed seconds, and a run that needed more
          # than one raises a warning annotation, so the lag stays visible instead of being
          # silently absorbed. That annotation is the only telemetry that can tell "the retry
          # earned its place" from "the flake did not recur today".
          #
          # `--no-cache-dir` is LOAD-BEARING, not hygiene: WITHOUT IT THIS RETRY IS INERT. pip
          # caches the simple index page on disk and serves it WITHOUT revalidating -- measured,
          # with a populated cache and the network made unreachable, `pip install
          # job-sluice==2.4.1` resolved entirely from cache and never requested
          # `/simple/job-sluice/`, while the same command with `--no-cache-dir` failed at exactly
          # that URL. So a retry that reuses the cache re-reads the SAME stale index and fails
          # identically, attempt after attempt. It also makes every attempt fetch from the
          # registry, which is the only thing this workflow exists to verify.
          attempts=6
          delay=15
          start="$SECONDS"
          installed=
          for n in $(seq 1 "$attempts"); do
            if ./v/bin/pip install --quiet --no-cache-dir "$@" "job-sluice==${VERSION}"; then
              installed=1
              elapsed=$(( SECONDS - start ))
              echo "installed job-sluice ${VERSION} on attempt ${n}/${attempts} after ${elapsed}s"
              if [ "$n" -gt 1 ]; then
                echo "::warning::job-sluice ${VERSION} only became installable from PyPI on attempt ${n}, ${elapsed}s into this step -- the index lagged the upload"
              fi
              break
            fi
            if [ "$n" -lt "$attempts" ]; then
              echo "attempt ${n}/${attempts} failed $(( SECONDS - start ))s in; retrying in ${delay}s"
              sleep "$delay"
              delay=$(( delay * 2 ))
            fi
          done
          # Fails CLOSED. A retry loop that exhausts and falls through to the smoke run would
          # turn a genuine publish failure GREEN, which is a worse outcome than the flake this
          # was added to absorb -- the whole point of the check is to say a broken version is
          # broken.
          if [ -z "$installed" ]; then
            echo "::error::job-sluice ${VERSION} was not installable from PyPI after ${attempts} attempts over $(( SECONDS - start ))s"
            exit 1
          fi

          PATH="${work}/v/bin:$PATH" ./v/bin/python "$smoke" "$VERSION" \
            --channel "pypi-${FORM}-py${PY}"

  deb:
    needs: version
    runs-on: ubuntu-latest
    container:
      # Pinned by digest like every action in this repo. Refresh deliberately:
      # a floating tag would change what this test ran against without a commit.
      image: debian@sha256:04634311a8d5fc442b6eb06d792293c4f3e2268652ca7634e00ce8ef5cc0a28a  # stable-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token is needed here -- the only checked-out file is the smoke script, and
          # every artefact is fetched from a public registry. Leaving credentials in .git
          # would put them in reach of anything this job runs.
          persist-credentials: false
          # NO sparse-checkout in the two `container:` jobs, deliberately. Neither base image
          # ships `git` (measured: `command -v git` is empty in both), so the action falls back
          # to downloading a tarball through the REST API, where sparse patterns have nothing to
          # act on -- the whole repository lands regardless. Declaring them anyway is a setting
          # that reads as doing something and does not, which this repo treats as drift. The
          # host-runner jobs below keep theirs, where git is present and they work.
      - name: Install the published .deb and run it as a NON-ROOT user
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates python3 >/dev/null
          curl -fsSL -o /tmp/js.deb \
            "https://github.com/${REPO}/releases/download/v${VERSION}/job-sluice_${VERSION}_all.deb"
          apt-get install -y -qq /tmp/js.deb >/dev/null
          # The whole point of this job: the install above proves nothing on its own, because
          # root bypasses the traversal checks an ordinary user is subject to.
          useradd -m smoke
          install -m 0644 scripts/smoke_installed.py /tmp/smoke.py
          cd /tmp
          # PYTHONPATH, because the .deb/.rpm deliberately do NOT install into system
          # site-packages -- nfpm.yaml unpacks the wheel to /usr/lib/job-sluice and ships
          # /usr/bin/job-sluice as a launcher that puts it on the path. So the CLI works
          # unaided (and the CLI-only checks pass without this), while `import sluice`
          # does not. Measured on the published 2.2.0 .deb: 3 of 5 checks errored with
          # ModuleNotFoundError until this was set. Pointing at the shipped tree is what
          # makes the import-based checks interrogate the INSTALLED files rather than
          # some other copy.
          runuser -u smoke -- env PYTHONPATH=/usr/lib/job-sluice \
            python3 /tmp/smoke.py "$VERSION" --channel deb-nonroot

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container:
      # Pinned by digest -- `latest` is a floating tag, and a smoke test whose base
      # image moves under it cannot tell a package regression from a distro change.
      image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token is needed here -- the only checked-out file is the smoke script, and
          # every artefact is fetched from a public registry. Leaving credentials in .git
          # would put them in reach of anything this job runs.
          persist-credentials: false
          # No sparse-checkout: see the .deb job above -- this image ships no `git` either, so
          # the pattern would be inert.
      - name: Install the published .rpm and run it as a NON-ROOT user
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dnf install -y -q curl shadow-utils util-linux python3 >/dev/null
          curl -fsSL -o /tmp/js.rpm \
            "https://github.com/${REPO}/releases/download/v${VERSION}/job-sluice-${VERSION}-1.noarch.rpm"
          dnf install -y -q /tmp/js.rpm >/dev/null
          useradd -m smoke
          install -m 0644 scripts/smoke_installed.py /tmp/smoke.py
          cd /tmp
          # PYTHONPATH, because the .deb/.rpm deliberately do NOT install into system
          # site-packages -- nfpm.yaml unpacks the wheel to /usr/lib/job-sluice and ships
          # /usr/bin/job-sluice as a launcher that puts it on the path. So the CLI works
          # unaided (and the CLI-only checks pass without this), while `import sluice`
          # does not. Measured on the published 2.2.0 .deb: 3 of 5 checks errored with
          # ModuleNotFoundError until this was set. Pointing at the shipped tree is what
          # makes the import-based checks interrogate the INSTALLED files rather than
          # some other copy.
          runuser -u smoke -- env PYTHONPATH=/usr/lib/job-sluice \
            python3 /tmp/smoke.py "$VERSION" --channel rpm-nonroot

  docker:
    # The image ships its own interpreter, so the smoke script is mounted in and run through
    # `python3`. `--entrypoint` is overridden because the image's own entrypoint is the CLI,
    # which would otherwise swallow the script path as an argument.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token is needed here -- the only checked-out file is the smoke script, and
          # every artefact is fetched from a public registry. Leaving credentials in .git
          # would put them in reach of anything this job runs.
          persist-credentials: false
          sparse-checkout: scripts/smoke_installed.py
          sparse-checkout-cone-mode: false
      - name: Run the published image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # A registry reference must be lowercase, and `github.repository_owner` preserves the
          # account's real casing -- measured: `docker pull ghcr.io/MrReasonable/job-sluice:2.2.0`
          # is rejected at PARSE with "repository name must be lowercase", so this job would have
          # failed on every single run and `report` (needs: docker, always()) would have redded
          # the whole workflow while the image channel was never exercised once. Folded rather
          # than hardcoded: the literal owner was deliberately removed from here as a drift
          # surface, and `release-please.yml` pushes to the lowercase form independently.
          img="ghcr.io/$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')/job-sluice:${VERSION}"
          docker pull -q "$img"
          docker run --rm --entrypoint python3 \
            -v "${PWD}/scripts/smoke_installed.py:/tmp/smoke.py:ro" -w /tmp \
            "$img" /tmp/smoke.py "$VERSION" --channel docker

  report:
    # One place to read the verdict. `always()` so a failed channel still reports rather than
    # leaving the summary blank -- and the step FAILS if any channel did, because a green
    # summary sitting above a red job is worse than no summary at all.
    needs: [version, pypi, deb, rpm, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          R_PYPI: ${{ needs.pypi.result }}
          R_DEB: ${{ needs.deb.result }}
          R_RPM: ${{ needs.rpm.result }}
          R_DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          {
            echo "## Post-release install check — job-sluice ${VERSION}"
            echo
            echo "| channel | result |"
            echo "|---|---|"
            echo "| PyPI (wheel + sdist, py3.12–3.14) | ${R_PYPI} |"
            echo "| .deb, installed and run as non-root | ${R_DEB} |"
            echo "| .rpm, installed and run as non-root | ${R_RPM} |"
            echo "| ghcr image | ${R_DOCKER} |"
            echo
            echo "Homebrew is not listed because it is already covered upstream:"
            echo "\`release-please.yml\`'s \`homebrew\` job renders, audits, installs and tests"
            echo "the formula before the tap is pushed."
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$R_PYPI" "$R_DEB" "$R_RPM" "$R_DOCKER"; do
            if [ "$r" != success ]; then
              echo "::error::a published artefact failed its install check"; exit 1
            fi
          done
