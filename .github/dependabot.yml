# Dependabot keeps the SHA-pinned actions and pip deps current.
#
# The pinning that makes the supply chain safe is exactly what makes it stale: a
# SHA pin never updates itself (a tag can be moved under you, a SHA cannot), so
# without automation the pins freeze permanently and the repo silently accrues
# actions with known CVEs while *looking* well-secured (#3). Dependabot rewrites
# both the SHA *and* its trailing `# vX.Y.Z` comment, preserving the pin
# discipline rather than undoing it.
#
# Grouped, because each PR spends a scarce human/CodeRabbit review cycle: one
# weekly PR per ecosystem beats a fan-out of one-per-dependency. Conventional
# `<type>(deps):` prefixes, because this repo enforces conventional commits and
# merges with `--rebase` (each commit lands on main verbatim, so Dependabot's
# default `Bump X ...` subject would break the convention on the default branch).
version: 2
updates:
  # The load-bearing ecosystem: the workflow actions in .github/workflows/.
  # `directory: /` is where Dependabot looks for .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # pip covers the root pyproject.toml (runtime pyyaml + optional extras) and the
  # hash-pinned zizmor audit tool. `.github/zizmor-requirements.txt` is
  # `--require-hashes` across every platform wheel; Dependabot resolves hashes on
  # its own (Linux) runner on a bump, so it is NOT guaranteed to reproduce the
  # full cross-platform set. A narrowed set would still pass CI (ubuntu-only) while
  # quietly weakening the pin — so check the regenerated hash block on the bump PR
  # (re-run the regen command in zizmor-requirements.txt if it dropped platforms)
  # before merge.
  - package-ecosystem: pip
    directories:
      - /
      - /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # setuptools here is a build-system floor (`requires = ["setuptools>=N"]`) --
      # a MINIMUM, not a pin. A PEP 517 isolated build (what `pip install` does here)
      # installs the current setuptools regardless of the floor, so raising it carries
      # no supply-chain value and just spends a review cycle each release (#71 bumped
      # it 61 -> 83 for nothing under this repo's isolated build). pyproject declares
      # no other version-constrained dependency -- every runtime and extra dep is an
      # unpinned name Dependabot has nothing to update -- so `/` now yields no bumps,
      # yet it stays in `directories` so a future *pinned* pyproject dep is still
      # covered. Revisit if setuptools ever becomes a pinned+hashed dep here: this
      # blanket, version-unscoped ignore would then silently exempt it.
      - dependency-name: setuptools
    groups:
      pip:
        patterns: ["*"]

  # docker covers the Dockerfile's digest-pinned base image (#104 PR 4).
  #
  # This entry is what makes that pin safe rather than a liability, and it is the same argument
  # this file's header already makes for the action pins: a digest never updates itself, so
  # without an updater the base image freezes permanently and the published image silently
  # accrues known CVEs in cairo/pango/openssl while LOOKING well-secured (#3). Dependabot
  # rewrites the digest and keeps the `name:tag@sha256:...` form, so the tag stays legible.
  #
  # `directory: /` is where the Dockerfile lives. docker-compose.yml is deliberately NOT a
  # second entry: it references ghcr.io/mrreasonable/job-sluice, this repo's OWN image, and
  # there is nothing upstream there to bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      docker:
        patterns: ["*"]

  # npm covers package.json -- the rulesync generator only; sluice itself ships no JS.
  # A bump here is EXPECTED to land red: scripts/guard_rulesync_drift.py pins the per-feature
  # output counts, and a new rulesync version moves them. That is the gate working. Update
  # EXPECTED and re-audit .gitignore's generated-output list on the bump PR, then merge.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
