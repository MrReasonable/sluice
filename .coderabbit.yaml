# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# CodeRabbit configuration for sluice. Reviews run on pull requests.
language: en-GB
tone_instructions: >-
  Be direct and concise. Skip praise and filler. No emojis or em-dashes.
  Focus on correctness, security, and whether new code stays config-driven
  with no hardcoded personal data, paths, or credentials.

reviews:
  profile: chill
  # Approve once comments are resolved and pre-merge checks pass; request changes
  # (blocking) while any actionable comment is open, instead of comment-only.
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Re-running the review on EVERY push is what burns the plan's review quota: a
    # 49-file refactor pushed six times is six full reviews of the same PR, and it is
    # also exactly what usage-based billing charges per file for. Review on open and
    # on demand (`@coderabbitai review`) instead -- which is what you actually want:
    # reviewed when the PR is ready, not while it is still being iterated on.
    auto_incremental_review: false
    # release-please's PRs are machine-generated: a version bump, a manifest bump, and a
    # changelog section assembled from commit subjects CodeRabbit has already reviewed on
    # the PRs that introduced them. Reviewing them again spends a scarce Fair-Usage slot on
    # a diff with no new code in it.
    #
    # Matched on TITLE, not author, and the title is the more durable key. release-please's
    # title format is its own (`chore(<branch>): release <version>`) and does not depend on
    # who opens the PR -- an identity this repo has already changed once, from a PAT to a
    # GitHub App, which flipped the author from the repo owner to `<app>[bot]` mid-review.
    # A rule keyed on that would have needed rewriting each time; this one did not.
    #
    # The prefix will not catch a real PR that merely says "release" -- verified against
    # "fix(cv): release a held lead", which still gets reviewed.
    ignore_title_keywords:
      - "chore(main): release"
    base_branches:
      - main
  path_instructions:
    - path: sluice/**
      instructions: >-
        This is a config-driven pipeline meant to be reusable by anyone. Flag
        any hardcoded personal data, employer names, absolute file paths,
        hostnames, or credentials that belong in config or environment
        variables. Core modules must stay Python standard-library only. Writes
        to the vault or lead status must never clobber a field a human or
        another agent has already set (never-clobber / never-regress).
    - path: tests/**
      instructions: >-
        Tests use synthetic fixtures only. Flag any real personal data, real
        company names, or real URLs. Every test must assert on behaviour, not
        merely run without error.

        One exception, because it is public integration surface rather than
        private job-search data: the job-board identifiers this repo ships an
        adapter for, which are exactly the module basenames under
        `sluice/ingest/sources/` (linkedin, indeed, reed, jobserve, cwjobs and
        their siblings). These are allowed in test prose — docstrings
        describing a real incident in a named adapter — and as source
        identifiers. They are NOT allowed as a lead, employer or candidate
        fixture identity; use `Example <Word>` there, which
        `tests/test_fixture_name_neutrality.py` enforces over the identity
        positions. The exception permits these names, it does not prefer them:
        a test that does not care which adapter it is talking about should
        still use a synthetic id. Every other real company name stays flagged.

        A SECOND exception, for the same public-integration-surface reason and
        with the same limits: a value a test exists to ASSERT must appear in
        that test literally. A guard's falsify partner and a drift pin are
        worthless if the value is synthetic — the pattern can be broken for
        every real spelling while the row stays green, which is the failure
        mode this suite is built to prevent. Three concrete cases, all of them
        checked against real behaviour rather than argued for: this
        repository's OWN url, where a test pins a value the project publishes
        (`tests/test_packaging.py` on `[project.urls]`,
        `tests/test_doc_links_from_code.py` on the urls `sluice/` prints to a
        user's terminal); the PUBLIC API of a dependency this project ships an
        extra for (`InstalledAppFlow`, `run_local_server` from
        `google-auth-oauthlib`); and that dependency's DOCUMENTED endpoint
        hosts (`accounts.google.com`, `oauth2.googleapis.com`) and scope urls,
        which `docs/INSTALL.md` states in prose for the same reason.

        The limits are what make it an exception rather than a licence.
        Substituting a synthetic value must be shown to break the test —
        measured, not assumed — otherwise use one. None of this reaches a lead,
        employer or candidate identity, where `Example <Word>` still applies.
        And none of it admits a THIRD party's url, a private host, or an
        absolute path: `tests/test_no_leaked_files.py` sweeps every tracked
        file for those with an empty pathspec, and that guard is the authority,
        not this paragraph.
  tools:
    gitleaks:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
